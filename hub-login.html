<!doctype html>
<meta charset="utf-8">
<title>Sign in to Akatsuki</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 Outfit,system-ui,sans-serif;background:#0b0b0f;color:#f4f4f5">
<main style="max-width:360px;padding:32px;text-align:center;display:flex;flex-direction:column;gap:16px">
  <div style="font-size:2rem">🌑</div>
  <h1 style="margin:0;font-size:1.25rem">Sign in to Akatsuki</h1>
  <p id="msg" style="margin:0;color:#a1a1aa">Use the same Google account as your other apps.</p>
  <button id="go" style="padding:12px 20px;border:0;border-radius:10px;background:#ef4444;color:#fff;font:inherit;font-weight:600;cursor:pointer">Continue with Google</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/hub-config.js"></script>
<script>
  // The ONLY page with a hub client that reads the OAuth redirect. Same storageKey as
  // jlpt-adapter.js, so the main pages pick the session up from localStorage.
  const HUB_URL = window.AK_HUB_URL, HUB_ANON = window.AK_HUB_ANON;   // js/hub-config.js
  const c = supabase.createClient(HUB_URL, HUB_ANON, { auth: { storageKey: 'akatsuki_hub_auth', persistSession: true, detectSessionInUrl: true } });
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  async function done() {
    const { data } = await c.auth.getSession();
    if (!data.session) return false;
    msg.textContent = 'Signed in as ' + (data.session.user.email || 'you') + '. You can close this window.';
    go.style.display = 'none';
    if (window.opener) setTimeout(() => window.close(), 800);
    return true;
  }
  c.auth.onAuthStateChange(() => done());
  done();
  go.onclick = () => c.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
</script>
