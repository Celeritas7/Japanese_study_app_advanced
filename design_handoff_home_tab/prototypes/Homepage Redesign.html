<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Homepage Redesign · JLPT Vocabulary Master</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  html, body { background:#0f172a; min-height:100vh; font-family:'Noto Sans JP', system-ui, sans-serif; color:#f1f5f9; overscroll-behavior:none; }
  body { overflow-x:hidden; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  a { color:inherit; text-decoration:none; }

  /* Variant switcher — always visible at top */
  .switcher {
    position:sticky; top:0; z-index:100;
    background:rgba(15,23,42,0.92); backdrop-filter:blur(12px);
    border-bottom:1px solid #1e293b;
    padding:10px 12px 8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .switcher-title { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:1px; font-weight:600; text-align:center; }
  .switcher-row { display:flex; gap:6px; }
  .switcher-btn {
    flex:1; padding:8px 6px; border-radius:10px;
    background:#1e293b; color:#94a3b8; font-size:12px; font-weight:600;
    border:1.5px solid transparent; transition:all 0.15s;
    text-align:left;
  }
  .switcher-btn.active { background:#3b82f6; color:#fff; border-color:#60a5fa; }
  .switcher-btn .sw-label { font-size:11px; opacity:0.85; font-weight:500; }
  .switcher-btn .sw-name { display:block; font-size:13px; font-weight:700; margin-top:2px; }

  /* Mobile-first viewport */
  .phone {
    max-width:420px; margin:0 auto;
    min-height:calc(100vh - 80px);
    padding-bottom:32px;
    position:relative;
  }

  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .anim-fade { animation:fadeIn 0.25s ease-out; }
  .anim-slide { animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1); }

  /* Touch states */
  .tap { transition:transform 0.1s, opacity 0.15s; }
  .tap:active { transform:scale(0.97); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ─── Tokens lifted from the live app (styles.css + tailwind defaults) ────
const T = {
  bg:'#0f172a',         // body
  surface:'#1e293b',    // slate-800
  surfaceHi:'#334155',  // slate-700
  border:'#334155',
  text:'#f1f5f9',
  textMid:'#cbd5e1',
  textDim:'#94a3b8',
  textFaint:'#64748b',
  blue:'#3b82f6',       // tab active
  blueHi:'#60a5fa',
  emerald:'#10b981',
  emeraldHi:'#34d399',
  teal:'#14b8a6',
  amber:'#f59e0b',      // sentence box
  amberHi:'#fbbf24',
  rose:'#ef4444',
  roseHi:'#f87171',
  purple:'#a855f7',
  purpleHi:'#c084fc',
  indigo:'#6366f1',
};

// ─── Mode catalog (all 8 first-class study paths) ────────────────────────
// Icons chosen to feel like Tab Bar icons already in the app — single character
// kanji for "study" modes (Goi/Kanji) match the existing 学 logo treatment;
// emoji for content-driven modes match the existing 📺 anime / 📝 script tabs.
const MODES = {
  goi:    { ic:'あ', name:'Goi',           sub:'Vocabulary flashcards',   meta:'12 due',     col:T.emerald, kind:'jp' },
  kanji:  { ic:'漢', name:'Kanji',         sub:'Textbook kanji',          meta:'8 new',      col:T.rose,    kind:'jp' },
  srs:    { ic:'🔁', name:'SRS Review',    sub:'Spaced repetition',       meta:'15 due now', col:T.blue,    kind:'em' },
  self:   { ic:'📝', name:'Self Study',    sub:'Your saved words',        meta:'34 saved',   col:T.purple,  kind:'em' },
  groups: { ic:'🏷️', name:'Study by Group',sub:'Curated word sets',       meta:'24 groups',  col:T.amber,   kind:'em' },
  anime:  { ic:'🎬', name:'Anime Reader',  sub:'Naruto Shippuden',        meta:'Ep 247',     col:T.rose,    kind:'em' },
  script: { ic:'📜', name:'Script Reader', sub:'Your imports',            meta:'3 scripts',  col:T.teal,    kind:'em' },
  stats:  { ic:'📊', name:'Stats',         sub:"Today's progress",        meta:'+22 today',  col:T.textDim, kind:'em' },
};

// ─── Header (shared) — logo + name on left, stats + ⚙ on right ──────────
function Header() {
  return (
    <div style={{ padding:'12px 12px 6px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, minWidth:0, flexShrink:0 }}>
        <div style={{ width:36, height:36, borderRadius:10,
          background:`linear-gradient(135deg, ${T.emerald}, ${T.teal})`,
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#fff', fontWeight:700, fontSize:16, fontFamily:'Noto Sans JP', flexShrink:0 }}>学</div>
        <div style={{ fontSize:15, fontWeight:700, color:T.text, whiteSpace:'nowrap' }}>JLPT Master</div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
        {/* Stats quick-access — the 📊 mode card hoisted into the header */}
        <button className="tap" title="Today's progress" style={{
          padding:'6px 10px 6px 8px', borderRadius:11,
          background:T.surface, border:`1px solid ${T.border}`,
          display:'inline-flex', alignItems:'center', gap:6,
          color:T.textMid,
        }}>
          <span style={{ fontSize:15 }}>📊</span>
          <div style={{ textAlign:'left', lineHeight:1.1 }}>
            <div style={{ fontSize:11, color:T.text, fontWeight:700 }}>Stats</div>
            <div style={{ fontSize:9, color:T.textFaint, marginTop:1 }}>+22 today</div>
          </div>
        </button>
        <button className="tap" style={{ color:T.textDim, fontSize:18, padding:8 }}>⚙</button>
      </div>
    </div>
  );
}

// ─── Mode card primitive ─────────────────────────────────────────────────
function ModeCard({ mode, size = 'md', onClick, layout = 'grid' }) {
  const m = mode;
  const isJp = m.kind === 'jp';

  if (layout === 'row') {
    return (
      <button className="tap anim-fade" onClick={onClick} style={{
        width:'100%', padding:'12px 14px', borderRadius:14,
        background:T.surface, border:`1px solid ${T.border}`,
        display:'flex', alignItems:'center', gap:12, textAlign:'left',
      }}>
        <div style={{
          width:44, height:44, borderRadius:12, flexShrink:0,
          background:`linear-gradient(135deg, ${m.col}30, ${m.col}15)`,
          border:`1.5px solid ${m.col}50`,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize: isJp ? 22 : 20, color:m.col,
          fontFamily: isJp ? 'Noto Sans JP' : 'inherit',
          fontWeight: isJp ? 700 : 400,
        }}>{m.ic}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:2 }}>{m.name}</div>
          <div style={{ fontSize:11, color:T.textDim, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.sub}</div>
        </div>
        <div style={{ fontSize:11, color:m.col, fontWeight:700, flexShrink:0 }}>{m.meta} →</div>
      </button>
    );
  }

  // grid card (default)
  const cardSize = size === 'lg' ? { pad:18, ic:32, name:16, gap:12 } : { pad:14, ic:28, name:14, gap:10 };
  return (
    <button className="tap anim-fade" onClick={onClick} style={{
      padding:cardSize.pad, borderRadius:16,
      background:T.surface, border:`1px solid ${T.border}`,
      display:'flex', flexDirection:'column', gap:cardSize.gap, textAlign:'left',
      minHeight:size === 'lg' ? 130 : 110, position:'relative', overflow:'hidden',
    }}>
      {/* Color wash */}
      <div style={{ position:'absolute', top:0, right:0, width:80, height:80,
        background:`radial-gradient(circle, ${m.col}25, transparent 70%)`, pointerEvents:'none' }}/>
      <div style={{
        width: size==='lg'?48:40, height:size==='lg'?48:40, borderRadius:12,
        background:`linear-gradient(135deg, ${m.col}30, ${m.col}15)`,
        border:`1.5px solid ${m.col}50`,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize: cardSize.ic, color:m.col,
        fontFamily: isJp ? 'Noto Sans JP' : 'inherit',
        fontWeight: isJp ? 700 : 400, position:'relative', zIndex:1,
      }}>{m.ic}</div>
      <div style={{ position:'relative', zIndex:1 }}>
        <div style={{ fontSize:cardSize.name, fontWeight:700, color:T.text, marginBottom:3 }}>{m.name}</div>
        <div style={{ fontSize:11, color:T.textDim, lineHeight:1.3 }}>{m.sub}</div>
      </div>
      <div style={{ marginTop:'auto', position:'relative', zIndex:1,
        display:'inline-flex', alignSelf:'flex-start', padding:'2px 8px', borderRadius:6,
        background:`${m.col}20`, color:m.col, fontSize:10, fontWeight:700,
        textTransform:'uppercase', letterSpacing:0.5 }}>{m.meta}</div>
    </button>
  );
}

// ─── Group picker (shared drill-down for "Study by Group") ───────────────
const WORD_GROUPS = [
  { id:'g1', icon:'💼', name:'Business & Company',     count:48,  studied:62, due:8,  tag:'curated' },
  { id:'g2', icon:'📖', name:'N2 Wk 3 · Day 2',         count:20,  studied:60, due:8,  tag:'chapter' },
  { id:'g3', icon:'🎬', name:'Anime Saved (this week)', count:14,  studied:0,  due:14, tag:'saved' },
  { id:'g4', icon:'🔀', name:'N2 Synonyms',             count:36,  studied:25, due:15, tag:'curated' },
  { id:'g5', icon:'🚶', name:'Verbs of Motion',         count:18,  studied:88, due:2,  tag:'curated' },
  { id:'g6', icon:'🔢', name:'Counters & Quantifiers',  count:24,  studied:45, due:6,  tag:'curated' },
  { id:'g7', icon:'経', name:'Kanji compounds with 経',  count:12,  studied:33, due:5,  tag:'kanji' },
  { id:'g8', icon:'✨', name:'Recently saved',          count:9,   studied:0,  due:9,  tag:'saved' },
];

function GroupPicker({ onBack }) {
  const [filter, setFilter] = useState('all');
  const filters = [
    { id:'all',     lb:'All',       n:WORD_GROUPS.length },
    { id:'saved',   lb:'Saved',     n:WORD_GROUPS.filter(g=>g.tag==='saved').length },
    { id:'chapter', lb:'Chapters',  n:WORD_GROUPS.filter(g=>g.tag==='chapter').length },
    { id:'curated', lb:'Curated',   n:WORD_GROUPS.filter(g=>g.tag==='curated').length },
    { id:'kanji',   lb:'Kanji',     n:WORD_GROUPS.filter(g=>g.tag==='kanji').length },
  ];
  const visible = WORD_GROUPS.filter(g => filter==='all' || g.tag===filter);

  return (
    <div className="anim-slide" style={{ paddingBottom:24 }}>
      {/* Drill header */}
      <div style={{ padding:'12px 12px 8px', display:'flex', alignItems:'center', gap:10 }}>
        <button className="tap" onClick={onBack} style={{
          width:36, height:36, borderRadius:10, background:T.surface, border:`1px solid ${T.border}`,
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, color:T.textMid }}>←</button>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:17, fontWeight:700, color:T.text }}>Study by Group</div>
          <div style={{ fontSize:11, color:T.textFaint }}>{WORD_GROUPS.length} groups · pick one to focus</div>
        </div>
        <button className="tap" style={{ padding:'6px 10px', borderRadius:10, background:T.surface,
          border:`1px solid ${T.border}`, fontSize:13, color:T.textDim }}>🔍</button>
      </div>

      {/* Filter chips */}
      <div style={{ padding:'4px 12px 8px', display:'flex', gap:6, overflowX:'auto' }}>
        {filters.map(f => (
          <button key={f.id} className="tap" onClick={()=>setFilter(f.id)} style={{
            flexShrink:0, padding:'6px 12px', borderRadius:20,
            background: filter===f.id ? T.blue : T.surface,
            color: filter===f.id ? '#fff' : T.textDim,
            border: filter===f.id ? `1px solid ${T.blueHi}` : `1px solid ${T.border}`,
            fontSize:12, fontWeight:600,
          }}>
            {f.lb}<span style={{ marginLeft:6, opacity:0.7, fontSize:10 }}>{f.n}</span>
          </button>
        ))}
      </div>

      {/* Group list */}
      <div style={{ padding:'4px 12px', display:'flex', flexDirection:'column', gap:8 }}>
        {visible.map(g => (
          <button key={g.id} className="tap anim-fade" style={{
            width:'100%', padding:'12px 14px', borderRadius:14,
            background:T.surface, border:`1px solid ${T.border}`,
            display:'flex', alignItems:'center', gap:12, textAlign:'left',
          }}>
            <div style={{
              width:42, height:42, borderRadius:10, flexShrink:0,
              background:T.surfaceHi,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize: g.icon.length>1 ? 18 : 20,
              fontFamily: g.icon.length===1 && /[\u4e00-\u9fff]/.test(g.icon) ? 'Noto Sans JP' : 'inherit',
              color: g.tag==='kanji' ? '#dc2626' : T.text, fontWeight:700,
            }}>{g.icon}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:4 }}>{g.name}</div>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ fontSize:11, color:T.textFaint }}>{g.count} words</div>
                <div style={{ flex:1, background:T.surfaceHi, borderRadius:4, height:4, overflow:'hidden', maxWidth:80 }}>
                  <div style={{ background:T.emerald, height:'100%', width:`${g.studied}%`, borderRadius:4 }}/>
                </div>
                <div style={{ fontSize:10, color:T.textDim, fontWeight:600 }}>{g.studied}%</div>
              </div>
            </div>
            {g.due > 0 ? (
              <div style={{ padding:'3px 9px', borderRadius:10, background:T.amber+'25',
                color:T.amberHi, fontSize:11, fontWeight:700 }}>{g.due} due</div>
            ) : (
              <div style={{ fontSize:14, color:T.emerald }}>✓</div>
            )}
          </button>
        ))}
      </div>

      {/* New group CTA */}
      <div style={{ padding:'12px 12px 0' }}>
        <button className="tap" style={{
          width:'100%', padding:'12px', borderRadius:12,
          background:'transparent', border:`1.5px dashed ${T.border}`,
          color:T.textDim, fontSize:13, fontWeight:600,
        }}>+ Create new group</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// VARIANT A · Card grid dashboard
// ════════════════════════════════════════════════════════════════════════
function VariantA({ onGroups }) {
  // Layout: hero "continue" + 2-col grid of remaining 7 modes
  // Stats strip at top, no bottom tab bar (Study Mode Focus)
  // Stats hoisted to header — remove from the grid so it's not duplicated
  const order = ['kanji', 'srs', 'self', 'groups', 'anime', 'script'];

  return (
    <div className="anim-fade">
      <Header/>

      {/* Hero: Continue (Goi) — the canonical / default mode gets premium space */}
      <div style={{ padding:'14px 12px 8px' }}>
        <div style={{ fontSize:11, color:T.textFaint, textTransform:'uppercase', letterSpacing:1, fontWeight:600,
          padding:'0 4px', marginBottom:8 }}>Continue</div>
        <button className="tap" style={{
          width:'100%', padding:'18px', borderRadius:18,
          background:`linear-gradient(135deg, ${T.emerald}25, ${T.teal}15)`,
          border:`1.5px solid ${T.emerald}50`,
          display:'flex', alignItems:'center', gap:14, textAlign:'left', position:'relative', overflow:'hidden',
        }}>
          <div style={{ position:'absolute', top:-20, right:-20, fontSize:120, opacity:0.06,
            fontFamily:'Noto Sans JP', fontWeight:900, color:T.emerald }}>あ</div>
          <div style={{ width:54, height:54, borderRadius:14,
            background:`linear-gradient(135deg, ${T.emerald}, ${T.teal})`,
            display:'flex', alignItems:'center', justifyContent:'center',
            fontFamily:'Noto Sans JP', fontWeight:700, fontSize:24, color:'#fff' }}>あ</div>
          <div style={{ flex:1, position:'relative', zIndex:1 }}>
            <div style={{ fontSize:11, color:T.emeraldHi, fontWeight:700, marginBottom:2,
              textTransform:'uppercase', letterSpacing:0.8 }}>Resume Goi</div>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:2 }}>N2 · Wk 3 · Day 2</div>
            <div style={{ fontSize:12, color:T.textDim }}>12 of 20 words · vocabulary flashcards</div>
          </div>
          <div style={{ width:42, height:42, borderRadius:'50%', background:T.emerald,
            display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, color:'#fff', position:'relative', zIndex:1 }}>▶</div>
        </button>
      </div>

      {/* Section label */}
      <div style={{ fontSize:11, color:T.textFaint, textTransform:'uppercase', letterSpacing:1, fontWeight:600,
        padding:'10px 16px 8px' }}>All study modes</div>

      {/* 2-col grid */}
      <div style={{ padding:'0 12px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
        {order.map(k => (
          <ModeCard key={k} mode={MODES[k]} onClick={k==='groups'?onGroups:undefined} />
        ))}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// VARIANT B · Categorized hub
// ════════════════════════════════════════════════════════════════════════
function VariantB({ onGroups }) {
  const sections = [
    { id:'flash',   label:'Flashcards',  sub:'Drill vocabulary',     ids:['goi','kanji','srs','self'] },
    { id:'curated', label:'Curated',     sub:'Focus on a word set',  ids:['groups'] },
    { id:'reading', label:'Reading',     sub:'Tap words to save',    ids:['anime','script'] },
    { id:'progress',label:'Progress',    sub:'See how you\'re doing',ids:['stats'] },
  ];

  return (
    <div className="anim-fade">
      <Header/>

      <div style={{ padding:'8px 0 0' }}>
        {sections.map(sec => (
          <div key={sec.id} style={{ padding:'10px 12px 4px' }}>
            <div style={{ padding:'6px 4px 10px', display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
              <div>
                <div style={{ fontSize:13, fontWeight:700, color:T.text, marginBottom:1 }}>{sec.label}</div>
                <div style={{ fontSize:11, color:T.textFaint }}>{sec.sub}</div>
              </div>
              <div style={{ fontSize:10, color:T.textFaint, textTransform:'uppercase', letterSpacing:0.8, fontWeight:600 }}>{sec.ids.length} mode{sec.ids.length>1?'s':''}</div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {sec.ids.map(k => (
                <ModeCard key={k} mode={MODES[k]} layout="row" onClick={k==='groups'?onGroups:undefined} />
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// VARIANT C · Intent-first ("What do you want to do?")
// ════════════════════════════════════════════════════════════════════════
function VariantC({ onGroups }) {
  // Four intents that map onto the existing modes.
  // The intent label answers "why am I here right now?" — more discoverable
  // than mode names, and surfaces buried tools by association.
  const intents = [
    {
      id:'learn', icon:'🌱', label:'Learn new words', sub:'I want to add to my vocab',
      col:T.emerald,
      modes:['goi','kanji','anime'],
      action:'Goi N2 (12 due)',
    },
    {
      id:'review', icon:'🔁', label:'Review what I know', sub:'I want to keep it sticky',
      col:T.blue,
      modes:['srs','self'],
      action:'SRS · 15 due now',
    },
    {
      id:'focus', icon:'🎯', label:'Focus on a topic', sub:'I want to drill a specific set',
      col:T.amber,
      modes:['groups'],
      action:'24 groups available',
      onAction:onGroups,
    },
    {
      id:'read', icon:'📖', label:'Read Japanese', sub:'I want to study in context',
      col:T.rose,
      modes:['anime','script'],
      action:'Naruto · Episode 247',
    },
  ];

  return (
    <div className="anim-fade">
      <Header/>

      {/* Prompt */}
      <div style={{ padding:'18px 16px 10px' }}>
        <div style={{ fontSize:19, fontWeight:700, color:T.text, lineHeight:1.3 }}>
          What do you want to do today?
        </div>
        <div style={{ fontSize:12, color:T.textFaint, marginTop:4 }}>Pick by intent — then choose a mode</div>
      </div>

      {/* Intent cards */}
      <div style={{ padding:'0 12px', display:'flex', flexDirection:'column', gap:10 }}>
        {intents.map(intent => (
          <button key={intent.id} className="tap" onClick={intent.onAction}
            style={{
              width:'100%', padding:14, borderRadius:18,
              background:T.surface, border:`1px solid ${T.border}`,
              textAlign:'left', position:'relative', overflow:'hidden',
            }}>
            {/* Color wash */}
            <div style={{ position:'absolute', top:-10, right:-10, width:140, height:140,
              background:`radial-gradient(circle, ${intent.col}20, transparent 65%)`, pointerEvents:'none' }}/>

            <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12, position:'relative' }}>
              <div style={{ width:46, height:46, borderRadius:13,
                background:`linear-gradient(135deg, ${intent.col}, ${intent.col}aa)`,
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>
                {intent.icon}
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:15, fontWeight:700, color:T.text }}>{intent.label}</div>
                <div style={{ fontSize:11, color:T.textDim, marginTop:2 }}>{intent.sub}</div>
              </div>
            </div>

            {/* Mode chips (the "we know how to do this" reassurance) */}
            <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:12, position:'relative' }}>
              {intent.modes.map(k => {
                const m = MODES[k];
                return (
                  <div key={k} style={{
                    display:'inline-flex', alignItems:'center', gap:5,
                    padding:'4px 9px', borderRadius:8,
                    background:T.surfaceHi, fontSize:11, color:T.textMid, fontWeight:500,
                  }}>
                    <span style={{
                      fontFamily: m.kind==='jp' ? 'Noto Sans JP' : 'inherit',
                      color:m.col, fontWeight:m.kind==='jp'?700:400,
                    }}>{m.ic}</span>
                    {m.name}
                  </div>
                );
              })}
            </div>

            {/* Primary action */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
              padding:'10px 12px', borderRadius:10,
              background:`${intent.col}20`, position:'relative' }}>
              <div style={{ fontSize:13, color:intent.col, fontWeight:700 }}>{intent.action}</div>
              <div style={{ fontSize:14, color:intent.col }}>→</div>
            </div>
          </button>
        ))}
      </div>

      {/* Footer link — escape hatch to mode list */}
      <div style={{ padding:'18px 16px 8px', textAlign:'center' }}>
        <button className="tap" style={{ fontSize:12, color:T.textFaint, padding:6 }}>
          or browse all 8 modes →
        </button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// SWITCHER + APP SHELL
// ════════════════════════════════════════════════════════════════════════
function App() {
  const [variant, setVariant] = useState('A');
  const [view, setView] = useState('home');

  // When switching variant from group picker, reset to home of new variant
  const switchTo = (v) => {
    setVariant(v);
    setView('home');
  };

  const onGroups = () => setView('groups');
  const onBack = () => setView('home');

  const variants = [
    { id:'A', lb:'Card grid',     sub:'Mode-first' },
    { id:'B', lb:'Categorized',   sub:'Section hub' },
    { id:'C', lb:'Intent-first',  sub:'"What do you want?"' },
  ];

  return (
    <>
      <div className="switcher">
        <div className="switcher-title">Homepage variant · tap to compare</div>
        <div className="switcher-row">
          {variants.map(v => (
            <button key={v.id}
              className={`switcher-btn ${variant===v.id?'active':''}`}
              onClick={()=>switchTo(v.id)}>
              <span className="sw-label">Variant {v.id}</span>
              <span className="sw-name">{v.lb}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="phone">
        {view === 'groups' ? (
          <GroupPicker onBack={onBack} />
        ) : (
          <>
            {variant === 'A' && <VariantA onGroups={onGroups}/>}
            {variant === 'B' && <VariantB onGroups={onGroups}/>}
            {variant === 'C' && <VariantC onGroups={onGroups}/>}
          </>
        )}

        {/* Rationale footer — only on home view */}
        {view === 'home' && (
          <div style={{ margin:'20px 12px 0', padding:14, borderRadius:12,
            background:'rgba(59,130,246,0.06)', border:`1px solid ${T.blue}30` }}>
            <div style={{ fontSize:10, color:T.blueHi, textTransform:'uppercase', letterSpacing:1, fontWeight:700, marginBottom:6 }}>
              Variant {variant} · rationale
            </div>
            <div style={{ fontSize:12, color:T.textMid, lineHeight:1.55 }}>
              {variant === 'A' && (
                <>
                  <strong style={{ color:T.text }}>Card grid dashboard.</strong> Hero "Continue" card for the canonical path (Goi resume) + 7 mode cards in a 2-col grid. Every mode visible above the fold within one tap.
                  <br/><br/>
                  <span style={{ color:T.textFaint }}>Trade-off: equal visual weight makes it harder to suggest "what next?" — works well once you know what you want, less for serendipity.</span>
                </>
              )}
              {variant === 'B' && (
                <>
                  <strong style={{ color:T.text }}>Categorized hub.</strong> Modes grouped by purpose — Flashcards / Curated / Reading / Progress. Row layout per section reads like a clean settings page; sections give scannable structure.
                  <br/><br/>
                  <span style={{ color:T.textFaint }}>Trade-off: more vertical scrolling than A; reading 8 row-cards is slightly slower than scanning a grid. Better for "I'll come back to this" navigation than first-glance discovery.</span>
                </>
              )}
              {variant === 'C' && (
                <>
                  <strong style={{ color:T.text }}>Intent-first.</strong> Asks "what do you want to do?" — then shows the modes that satisfy that intent. Each intent has a primary action so the lazy path is one tap; the chips advertise the other tools that fit.
                  <br/><br/>
                  <span style={{ color:T.textFaint }}>Trade-off: a layer of indirection — power users who know their mode might find this slower. But it solves your "I forget I have other tools" problem at the IA level, not just visually.</span>
                </>
              )}
            </div>
          </div>
        )}

        {/* Bottom safe area */}
        <div style={{ height:24 }}/>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
