<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hub Queue Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#0a0e1a;--bg-surface:#1e293b;--bg-card:#1e293b;--bg-elevated:#0f172a;--border-dim:#334155;--border-glow:#475569;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-cyan:#34d399;--accent-pink:#f87171;--accent-amber:#f59e0b;--accent-purple:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg-deep);color:var(--text-primary);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--accent-cyan);text-decoration:none}a:hover{color:var(--accent-amber)}
.hide-sb::-webkit-scrollbar{display:none}.hide-sb{-ms-overflow-style:none;scrollbar-width:none}
.hdr{background:var(--bg-surface);border-bottom:1px solid var(--border-dim);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:60}
.hdr h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:15px;font-weight:700;white-space:nowrap}
.hdr .sp{flex:1}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;border:1px solid var(--border-dim);border-radius:99px;padding:3px 9px;color:var(--text-secondary);white-space:nowrap}
.btn{border:1px solid var(--border-dim);background:var(--bg-card);color:var(--text-secondary);border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:rgba(52,211,153,.12);border-color:var(--accent-cyan);color:var(--accent-cyan)}
.btn.amber{border-color:var(--accent-amber);color:var(--accent-amber);background:rgba(245,158,11,.1)}
.btn.danger{border-color:#f8717155;color:var(--accent-pink)}
.tabs{display:flex;gap:2px;background:var(--bg-surface);border-bottom:1px solid var(--border-dim);padding:0 10px;position:sticky;top:57px;z-index:59;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font:inherit;font-size:12.5px;padding:11px 12px;cursor:pointer;white-space:nowrap;min-height:42px}
.tabs button.on{color:var(--accent-amber);border-bottom-color:var(--accent-amber)}
.tabs button b{font-family:'IBM Plex Mono',monospace;font-size:10px;margin-left:5px;opacity:.75}
.view{max-width:960px;margin:0 auto;padding:14px}
.grpbar{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border-dim);border-radius:13px;padding:12px 14px;margin-bottom:12px;flex-wrap:wrap}
.grpbar .gk{font-size:32px;line-height:1}
.grpbar .gt{flex:1;min-width:140px}
.grpbar .gt .t{font-size:13px;font-weight:700}
.grpbar .gt .s{font-size:11px;color:var(--text-muted);margin-top:2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;margin-bottom:14px}
.strip button{flex-shrink:0;width:46px;height:46px;border:1px solid var(--border-dim);background:var(--bg-card);border-radius:11px;font:inherit;font-size:22px;color:var(--text-secondary);cursor:pointer;position:relative;padding:0}
.strip button.prim{border-color:#a855f766;color:var(--accent-purple);background:rgba(168,85,247,.07)}
.strip button.on{border-color:var(--accent-amber);color:var(--text-primary);background:rgba(245,158,11,.12)}
.strip button.prim.on{border-color:var(--accent-amber);color:var(--accent-purple);background:rgba(245,158,11,.12)}
.strip button i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:13px;height:2px;border-radius:2px}
.s-ok{background:var(--accent-cyan)}.s-pending{background:var(--accent-amber)}.s-none{background:var(--border-glow)}.s-bad{background:var(--accent-pink)}
.card{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:15px;padding:18px;margin-bottom:14px}
.top{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--border-dim)}
.top .k{font-size:72px;line-height:.95;flex-shrink:0}
.top .meta{flex:1;min-width:0}
.top .kw{font-size:16px;font-weight:700;margin-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .rd{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-secondary);line-height:1.7}
.comp{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}
.comp>span{border:1px dashed var(--border-glow);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text-secondary)}
.comp>span .jp{font-size:15px;color:var(--text-primary);border:none;padding:0;background:none}
.tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 9px;border:1px solid;white-space:nowrap}
.tag.bad{color:var(--accent-pink);border-color:#f8717155;background:rgba(248,113,113,.08)}
.tag.warn{color:var(--accent-amber);border-color:#f59e0b55;background:rgba(245,158,11,.08)}
.tag.ok{color:var(--accent-cyan);border-color:#34d39955;background:rgba(52,211,153,.08)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1024px){.two{grid-template-columns:1fr 1fr}}
.box{border:1px solid var(--border-dim);background:var(--bg-elevated);border-radius:12px;padding:13px}
.box.new{border-color:var(--accent-amber);background:rgba(245,158,11,.05)}
.box h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box p{font-size:13.5px;line-height:1.72;white-space:pre-wrap}
.box p+p{margin-top:9px}
.box .jp{color:var(--accent-purple)}
.box em{color:var(--text-secondary);font-style:normal}
.box.old p{color:var(--text-muted)}
.box .rowlbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin:10px 0 3px}
.sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 7px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1 1 120px;text-align:center;justify-content:center}
.swipe{display:none;gap:6px;margin-bottom:10px}
.swipe button{flex:1;border:1px solid var(--border-dim);background:none;border-radius:9px;padding:8px;font:inherit;font-size:11.5px;color:var(--text-muted);cursor:pointer;min-height:38px}
.swipe button.on{border-color:var(--accent-amber);color:var(--accent-amber);background:rgba(245,158,11,.1)}
@media(max-width:719px){.swipe{display:flex}.two.ab .box{display:none}.two.ab .box.show{display:block}.top .k{font-size:54px}.top{gap:12px}.view{padding:11px}}
.empty{text-align:center;color:var(--text-muted);font-size:13px;padding:44px 16px;line-height:1.7}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet__inner{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:18px}
@media(min-width:720px){.sheet{align-items:center;padding:20px}.sheet__inner{border-radius:16px}}
.sheet__inner h3{font-size:15px;font-weight:700;margin-bottom:4px}
.sheet__inner .hint{font-size:11.5px;color:var(--text-muted);margin-bottom:14px;line-height:1.6}
textarea,input[type=text]{width:100%;background:var(--bg-elevated);border:1px solid var(--border-dim);border-radius:10px;color:var(--text-primary);font:inherit;font-size:13px;padding:11px;line-height:1.6;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent-amber)}
.flbl{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 5px;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-surface);border:1px solid var(--accent-cyan);color:var(--accent-cyan);padding:10px 18px;border-radius:99px;font-size:12.5px;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gitem{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.gitem:hover{border-color:var(--border-glow)}
.gitem .gk{font-size:26px}
.gitem .gm{flex:1;min-width:0;font-size:12.5px}
.gitem .gm small{display:block;color:var(--text-muted);font-size:10.5px;margin-top:2px}
.kchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.kchips span{border:1px solid var(--border-dim);border-radius:7px;padding:2px 7px;font-size:15px}
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.tabs button:disabled{cursor:default}
@media(max-width:480px){.hdr{gap:6px;padding:10px}.hdr .proto{display:none}.hdr h1{font-size:13.5px}.hdr .btn{padding:8px 9px}.hdr .pill{display:none}}
</style></head><body>
<div id="app"></div>
<script>
// PROTOTYPE ONLY — static data, nothing is saved. Hub glyphs, meanings, members and
// current stories are real rows from Supabase; the Claude drafts are samples.
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const jp=s=>esc(s).replace(/([぀-ヿ一-鿿]+)/g,'<span class="jp">$1</span>');
const HUBS=[
 {id:196,glyph:'人',meaning:'person',members:'人 佐 但 住 位 体 悠 件 仕 伝 仏 休 仮 伯 俗 信 佳 依 例 側 侍 値 倣 倒 偵 僧 億 儀 償 催 仁 侮 使 便 倍 優 伐 宿 傷 褒 傑 俊',n:43,
  cur:'* as a primitive, it can keep its kanji form except when it appears to the left (its normal position), where it is made to stand up in the form l. The primitive meaning is another matter. The abstract notion of person so often has a relation to the meaning of the kanji that confusion readily sets in. So many of the previous stories have included people in them…',
  draft:{meaning:'person / the stand-in',persona:'A lanky stand-in actor in a grey coat who leans against the left edge of every kanji, waiting for a role.',
  story:'人（ひと）is the stand-in: tall, thin, grey coat, always propped against the left wall of the kanji, waiting to be cast. Whatever stands to his right is the part he has been handed today. Give him a tree and he slumps against it: 休（やすむ）, rest. Hand him a script of 言 words and he swears to deliver it exactly: 信（しんじる）, trust. Put him beside 主, the master of the house, and he finally gets to live there: 住（すむ）, dwell. Stand him next to 立 and he is told where to stand on stage: 位（くらい）, rank. Every time you see the thin slanted stroke on the left, picture the stand-in and ask what role he got.'},
  status:'pending'},
 {id:649,glyph:'扌',meaning:'fingers',members:'抹 抱 搭 抄 抗 批 招 拓 拍 打 拘 捨 拐 挑 持 揮 揚 提 損 拾 担 拠 描 接 掲 掛',n:27,
  cur:'* fingers − This alternate form of the primitive for hand we shall use to represent finger or fingers. It always appears at the left. [3]',
  draft:{meaning:'grabbing hand',persona:'A pickpocket\'s quick hand: three twitchy fingers and a hooked thumb that grab whatever sits to its right.',
  story:'扌（て）is the pickpocket\'s hand. It never rests; whatever lands beside it gets grabbed, and the kanji tells you what the hand does with its loot. It grabs a 丁 nail and hammers it home: 打（うつ）, strike. It grabs the 寺 temple bell-rope and will not let go: 持（もつ）, hold. It finds two halves that 合 fit together lying on the road and scoops them up: 拾（ひろう）, pick up. It grabs a whole 舎 cottage and flings it over the fence: 捨（すてる）, throw away. Left-side hooked hand = something is being done by hand, quickly and a little greedily.'},
  status:'pending'},
 {id:659,glyph:'心',meaning:'it appears beneath or to the right of its relative primitive and means the physical organ of the heart.',members:'心 忘 忍 忌 志 忠 思 恩 応 想 恵 恐 感 憂 寡',n:16,
  cur:'* as a primitive, it can take three forms, to which we shall assign three distinct meanings. * In its kanji-form, it appears beneath or to the right of its relative primitive and means the physical organ of the heart.',
  draft:null,status:'bad'},
 {id:294,glyph:'木',meaning:'tree, wood',members:'',n:19,status:'bad'},
 {id:299,glyph:'禾',meaning:'wheat',members:'',n:17,status:'bad'},
 {id:371,glyph:'糸',meaning:'thread',members:'',n:31,status:'bad'},
 {id:253,glyph:'⻖',meaning:'heights, slope',members:'',n:15,status:'bad'},
 {id:81,glyph:'言',meaning:'saying, speech, words',members:'',n:14,status:'bad'},
 {id:421,glyph:'隹',meaning:'turkey',members:'',n:14,status:'bad'},
 {id:660,glyph:'⺖',meaning:'busy, occupied, restless',members:'',n:13,status:'bad'},
].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.n-a.n);
let sel=HUBS[0].id,ab='new',done=null,allMembers=false;
const st={pending:'s-pending',bad:'s-bad',ok:'s-ok'};
function render(){
  const h=HUBS.find(x=>x.id===sel),d=h.draft,pend=HUBS.filter(x=>x.status==='pending').length;
  const tabs=[['pending','Pending drafts',0],['hubs','Hubs',686],['booklike','Book-like',2532],['nostory','No story',92],['flagged','Flagged',31],['misfit','Bad fit',0],['groups','Groups',686],['approved','Approved',0]];
  const strip=HUBS.map(x=>`<button data-h="${x.id}" class="${x.id===sel?'on':''}" title="${x.n} entries">${esc(x.glyph)}<sup style="font-size:8px;opacity:.6;position:absolute;top:3px;right:4px">${x.n}</sup><i class="${st[x.status]}"></i></button>`).join('');
  const mem=(h.members||'').split(' ').filter(Boolean),shown=allMembers?mem:mem.slice(0,14);
  const chips=shown.map(k=>`<span>${esc(k)}</span>`).join('')+(mem.length>shown.length?`<span id="moreBtn" style="cursor:pointer;color:var(--accent-cyan);font-size:11px;padding:4px 8px">+${mem.length-shown.length} more</span>`:'');
  const newBox=d?`<div class="box new ${ab==='new'?'show':''}" data-ab="new"><h4>Claude draft<span style="color:var(--accent-amber)">pending</span></h4><p>${jp(d.story)}</p></div>`
    :`<div class="box new ${ab==='new'?'show':''}" data-ab="new"><h4>No draft yet</h4><p style="color:var(--text-muted)">Tap 📋 Hub prompt, paste Claude's JSON back, and the draft appears here.</p></div>`;
  const oldBox=`<div class="box old ${ab==='old'?'show':''}" data-ab="old"><h4>Current hub story<span>${d?'would be replaced':'live'}</span></h4><p>${h.cur?jp(h.cur):'<em>empty</em>'}</p></div>`;
  const doneBar=done?`<div class="grpbar" style="border-color:var(--accent-cyan)"><span class="gk">${esc(done.glyph)}</span><div class="gt"><div class="t" style="color:var(--accent-cyan)">✓ Hub published</div><div class="s">Its persona now goes into every member's prompt</div></div><button class="btn primary" id="membersBtn">Write its ${done.n} members →</button></div>`:'';
  document.getElementById('app').innerHTML=`
  <div class="hdr"><h1>漢字 Story Panel</h1><span class="pill">${pend} pending</span><span class="pill proto" style="border-color:var(--accent-purple);color:var(--accent-purple)">prototype</span><span class="sp"></span>
    <button class="btn amber" id="copyBtn" title="On the Hubs tab this copies the hub prompt">📋 Hubs (6)</button><button class="btn" id="pasteBtn">📥 Paste</button><a class="btn">←</a></div>
  <div class="tabs hide-sb">${tabs.map(([k,l,n])=>`<button class="${k==='hubs'?'on':''}" ${k==='hubs'?'':'disabled style="opacity:.55"'}>${l}${k==='hubs'?' <span style="color:var(--accent-purple);font-size:9px">NEW</span>':''}<b>${n.toLocaleString()}</b></button>`).join('')}</div>
  <div class="view">
    ${doneBar}
    <div class="grpbar"><span class="gk">⛩</span><div class="gt"><div class="t">Hubs first, then their members</div><div class="s">686 hubs need a persona or an original story · ${pend} draft${pend===1?"":"s"} waiting · biggest hubs first</div></div></div>
    <div class="strip hide-sb">${strip}</div>
    <div class="card">
      <div class="top"><span class="k">${esc(h.glyph)}</span><div class="meta">
        <div class="kw">${esc(d?.meaning||h.meaning)}<span class="tag" style="color:var(--accent-purple);border-color:#a855f755;background:rgba(168,85,247,.1)">hub</span>${h.status==='bad'||d?'<span class="tag bad">current story looks book-like</span>':''}${d&&d.meaning!==h.meaning?`<span class="tag warn">meaning → ${esc(d.meaning)}</span>`:''}</div>
        <div class="rd">${h.n} entries in this hub</div>
        ${chips?`<div class="kchips">${chips}</div>`:''}
      </div></div>
      <div class="sub" style="margin-top:0">Persona: what you picture every time</div>
      <div class="box ${d?'new':''}" style="margin-bottom:12px"><p>${d?jp(d.persona):'<em>none set yet</em>'}</p></div>
      <div class="swipe"><button data-ab-btn="new" class="${ab==='new'?'on':''}">New draft</button><button data-ab-btn="old" class="${ab==='old'?'on':''}">Current story</button></div>
      <div class="two ab">${newBox}${oldBox}</div>
      <div class="acts">
        <button class="btn primary" id="approveBtn" ${d?'':'disabled'}>✓ Publish &amp; next</button>
        <button class="btn" id="editBtn" ${d?'':'disabled'}>✎ Edit draft</button>
        <button class="btn" id="rejectBtn" ${d?'':'disabled'}>✕ Reject</button>
        <button class="btn" id="skipBtn">Skip</button>
      </div>
    </div>
  </div>`;
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{sel=+b.dataset.h;ab='new';allMembers=false;render()});
  document.querySelectorAll('[data-ab-btn]').forEach(b=>b.onclick=()=>{ab=b.dataset.abBtn;render()});
  const next=()=>{const i=HUBS.findIndex(x=>x.id===sel);sel=HUBS[(i+1)%HUBS.length].id;ab='new';render()};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on('approveBtn',()=>{h.status='ok';h.cur=d.story;h.meaning=d.meaning;h.draft=null;done=h;toast('✓ Hub '+h.glyph+' published');next()});
  on('rejectBtn',()=>{h.draft=null;h.status='bad';toast('Hub draft rejected');next()});
  on('skipBtn',next);
  on('moreBtn',()=>{allMembers=true;render()});
  on('editBtn',()=>toast('Opens the same edit sheet as character drafts'));
  on('copyBtn',()=>toast('📋 Hub prompt for 6 hub(s) copied'));
  on('pasteBtn',()=>toast('Same Paste sheet; hub replies are detected automatically'));
  on('membersBtn',()=>toast('→ Book-like tab, filtered to the '+done.glyph+' hub'));
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
render();
</script>
</body></html>
