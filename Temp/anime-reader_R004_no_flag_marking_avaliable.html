<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アニメ Reading Mode — JLPT Vocabulary Master</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg-deep:#0a0e1a;--bg-surface:#1e293b;--bg-card:#1e293b;--bg-elevated:#0f172a;--border-dim:#334155;--border-glow:#475569;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-cyan:#34d399;--accent-pink:#f87171;--accent-amber:#f59e0b;--accent-green:#34d399;--accent-purple:#a855f7;--word-known:#34d399;--word-unknown:#f87171;--word-saved:#a855f7}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
    .hide-sb::-webkit-scrollbar{display:none}.hide-sb{-ms-overflow-style:none;scrollbar-width:none}
    .app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-dim);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .app-title{font-family:'M PLUS Rounded 1c',sans-serif;font-size:16px;font-weight:700;color:var(--text-primary)}
    .header-actions{display:flex;gap:8px;align-items:center}
    .btn-icon{width:36px;height:36px;border:1px solid var(--border-dim);background:var(--bg-card);border-radius:8px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:16px;text-decoration:none}
    .btn-icon:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
    .btn-icon.active{border-color:var(--accent-amber);color:var(--accent-amber);background:rgba(245,158,11,.1);box-shadow:0 0 0 1px rgba(245,158,11,.3)}
    .view{padding:16px;max-width:580px;margin:0 auto}
    .card{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:14px;padding:20px;margin-bottom:16px}
    .form-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
    .form-input{width:100%;background:var(--bg-elevated);border:1px solid var(--border-dim);border-radius:8px;padding:10px 14px;font-size:15px;color:var(--text-primary);font-family:'Noto Sans JP',sans-serif;outline:none;transition:border-color .15s;margin-bottom:14px}
    .form-input:focus{border-color:var(--accent-cyan)}.form-input::placeholder{color:var(--text-muted)}
    .btn-primary{width:100%;padding:14px 24px;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,#10b981,#059669);color:#fff}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(16,185,129,.3)}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-secondary{padding:10px 20px;border:1px solid var(--border-dim);border-radius:10px;font-size:13px;font-weight:500;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;transition:all .15s}
    .btn-secondary:hover{border-color:var(--accent-cyan);color:var(--text-primary)}
    .ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
    .ep-btn{padding:12px 4px;border:1px solid var(--border-dim);border-radius:10px;background:var(--bg-elevated);color:var(--text-secondary);text-align:center;cursor:pointer;transition:all .15s;font-size:14px;font-weight:600}
    .ep-btn:hover{border-color:var(--accent-cyan);color:var(--text-primary);background:var(--bg-card)}
    .import-tabs{display:flex;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid var(--border-dim)}
    .import-tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;transition:all .15s;border:none}
    .import-tab.active{background:var(--accent-cyan);color:#06281d;font-weight:700}
    .drop-zone{border:2px dashed var(--border-glow);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg-card);margin-bottom:16px}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent-cyan);background:rgba(52,211,153,.05)}
    .text-import-area{width:100%;min-height:100px;background:var(--bg-elevated);border:1px solid var(--border-dim);border-radius:10px;padding:12px;font-size:15px;color:var(--text-primary);font-family:'Noto Sans JP',sans-serif;outline:none;resize:vertical;line-height:1.7;margin-bottom:16px}
    .reading-header{background:var(--bg-surface);border-bottom:1px solid var(--border-dim);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:49px;z-index:90}
    .reading-meta{flex:1;min-width:0}
    .reading-anime-name{font-size:15px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .reading-episode{font-size:11px;color:var(--text-muted)}
    .reading-episode b{color:var(--accent-amber);font-weight:600}
    .reading-stats{display:flex;gap:12px;font-size:11px;font-family:'IBM Plex Mono',monospace}
    .dialogue-container{padding:16px;max-width:680px;margin:0 auto}
    .dialogue-line{margin-bottom:14px;padding:16px 18px;background:var(--bg-card);border:1px solid var(--border-dim);border-radius:16px;animation:fadeUp .3s ease-out both}
    .dl-english{font-size:14px;color:var(--text-secondary);margin-top:8px;line-height:1.5}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .dl-timestamp{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:6px}
    .dl-speaker{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:6px;background:rgba(168,85,247,.15);color:var(--accent-purple);border:1px solid rgba(168,85,247,.3)}
    .dl-speaker.narrator{background:rgba(85,88,115,.2);color:var(--text-muted);border-color:var(--border-dim)}
    .dl-text{font-size:22px;line-height:1.7;letter-spacing:.02em;color:var(--text-primary)}
    .word-token{display:inline;cursor:pointer;border-radius:3px;padding:1px 2px;transition:all .12s;position:relative}
    .word-token:hover{background:rgba(255,255,255,.08)}
    .word-token.known{color:var(--word-known)}.word-token.unknown{color:var(--word-unknown);border-bottom:2px dotted var(--word-unknown)}.word-token.saved{color:var(--word-saved);border-bottom:2px solid var(--word-saved)}.word-token.punct{color:var(--text-muted);cursor:default}
    .word-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .15s ease-out}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .word-popup{width:100%;max-width:480px;background:var(--bg-elevated);border-top:1px solid var(--border-glow);border-radius:20px 20px 0 0;padding:24px 20px 32px;animation:slideUp .2s ease-out;max-height:70vh;overflow-y:auto}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .popup-handle{width:36px;height:4px;background:var(--border-glow);border-radius:2px;margin:0 auto 18px}
    .popup-surface{font-size:40px;font-weight:700;text-align:center;margin-bottom:4px}
    .popup-reading{font-size:18px;color:var(--accent-cyan);font-family:'M PLUS Rounded 1c',sans-serif;text-align:center}
    .popup-meaning{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:10px;padding:14px 16px;margin:14px 0}
    .popup-context{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:14px;color:var(--text-secondary);line-height:1.7}
    .popup-context em{color:var(--accent-pink);font-style:normal;font-weight:600}
    .popup-tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;margin-bottom:16px}
    .popup-tag.known{background:rgba(52,211,153,.12);color:var(--word-known);border:1px solid rgba(52,211,153,.25)}
    .popup-tag.unknown{background:rgba(248,113,113,.12);color:var(--word-unknown);border:1px solid rgba(248,113,113,.25)}
    .popup-tag.saved{background:rgba(168,85,247,.12);color:var(--word-saved);border:1px solid rgba(168,85,247,.25)}
    .btn-save-word{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,#a855f7,#8a5fd9);color:white}
    .btn-save-word:disabled{opacity:.4;cursor:not-allowed}
    /* --- interactivity layer --- */
    .reading-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bg-elevated);overflow:hidden}
    .reading-progress__fill{height:100%;width:0;background:linear-gradient(90deg,#34d399,#10b981);box-shadow:0 0 10px rgba(52,211,153,.6);border-radius:0 3px 3px 0;transition:width .7s cubic-bezier(.22,1,.36,1);animation:barIn .8s cubic-bezier(.22,1,.36,1)}
    @keyframes barIn{from{width:0}}
    .word-token:not(.punct):hover{background:rgba(255,255,255,.08)}
    .word-token:not(.punct):active{background:rgba(255,255,255,.2)}
    .word-token.saved{background:rgba(168,85,247,.14);border-radius:4px}
    .btn-save-word:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(168,85,247,.4)}
    .btn-save-word:not(:disabled):active{transform:scale(.98)}
    .btn-save-word.saved{animation:savePop .45s cubic-bezier(.22,1,.36,1)}
    @keyframes savePop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
    .popup-surface{animation:surfaceIn .35s cubic-bezier(.22,1,.36,1)}
    @keyframes surfaceIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
    .popup-tag{animation:surfaceIn .4s ease-out .05s both}
    .reading-stats span{transition:transform .15s;cursor:default}
    .reading-stats span:hover{transform:scale(1.18)}
    .ep-btn:active,.btn-secondary:active{transform:scale(.97)}
    /* --- chat layout --- */
    .dialogue-line{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;padding:0;background:transparent;border:none;border-radius:0}
    .dl-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-top:24px;border:2px solid rgba(255,255,255,.1);text-shadow:0 1px 3px rgba(0,0,0,.45)}
    .dl-main{flex:1;min-width:0}
    .dl-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;padding-left:3px;min-height:16px}
    .dl-name{font-size:12.5px;font-weight:700}
    .dl-linecount{font-size:10px;color:var(--text-muted)}
    .dl-bubble{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:4px 15px 15px 15px;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
    .dialogue-line.active .dl-bubble{border-color:var(--accent-purple);box-shadow:0 0 0 1px var(--accent-purple),0 10px 30px rgba(168,85,247,.2);transform:translateY(-2px)}
    .btn-save-word.saved{background:linear-gradient(135deg,#475569,#334155)}
    .btn-remove-word{width:100%;padding:10px;border:1px solid var(--border-dim);border-radius:10px;font-size:12px;background:transparent;color:var(--text-muted);cursor:pointer;margin-top:8px}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .summary-stat{text-align:center;padding:12px 8px;background:var(--bg-elevated);border-radius:10px}
    .summary-stat b{font-size:24px;font-family:'M PLUS Rounded 1c',sans-serif;display:block}
    .summary-stat small{font-size:10px;color:var(--text-muted);text-transform:uppercase}
    .word-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-dim)}
    .word-list-item:last-child{border-bottom:none}
    .login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .btn-google{padding:12px 32px;border:1px solid var(--border-glow);border-radius:12px;background:var(--bg-card);color:var(--text-primary);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
    .btn-google:hover{border-color:var(--accent-cyan);background:var(--bg-elevated)}
    .reading-footer-hint{text-align:center;font-size:12px;color:var(--text-muted);padding:8px 0 4px}
    /* --- [NEW] scenes + segments --- */
    .scene-header{display:flex;align-items:center;gap:12px;margin:26px 0 18px;animation:fadeUp .3s ease-out both}
    .scene-header:first-child{margin-top:4px}
    .scene-header::before,.scene-header::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border-dim))}
    .scene-header::after{background:linear-gradient(90deg,var(--border-dim),transparent)}
    .scene-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 16px;background:var(--bg-elevated);border:1px solid var(--border-dim);border-radius:12px;cursor:default;font-family:'Noto Sans JP',sans-serif}
    .scene-chip__title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase}
    .scene-chip__time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted)}
    .edit-on .scene-chip{cursor:pointer;transition:all .15s}
    .edit-on .scene-chip:hover{border-color:var(--accent-amber)}
    .edit-on .scene-chip:hover .scene-chip__title{color:var(--accent-amber)}
    .dl-seg{padding:11px 15px;position:relative;transition:background .15s,box-shadow .15s}
    .dl-seg + .dl-seg{border-top:1px dashed rgba(51,65,85,.7)}
    .dl-seg .dl-timestamp{margin-bottom:7px}
    /* --- [NEW] edit mode --- */
    .edit-on .dl-seg{cursor:pointer}
    .edit-on .dl-seg:hover{background:rgba(245,158,11,.05)}
    .edit-on .word-token{pointer-events:none}
    .dl-seg .seg-check{position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-glow);display:none;align-items:center;justify-content:center;font-size:12px;color:#0a0e1a;background:transparent}
    .edit-on .dl-seg .seg-check{display:flex}
    .dl-seg.selected{background:rgba(245,158,11,.09);box-shadow:inset 3px 0 0 var(--accent-amber)}
    .dl-seg.selected .seg-check{background:var(--accent-amber);border-color:var(--accent-amber)}
    .action-bar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(15,23,42,.97);border-top:1px solid var(--border-glow);backdrop-filter:blur(12px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto;animation:slideUpBar .2s ease-out}
    @keyframes slideUpBar{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .action-bar__count{font-size:12px;color:var(--text-secondary);flex:1;min-width:0}
    .action-bar__count b{color:var(--accent-amber)}
    .ab-btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border-dim);background:var(--bg-card);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
    .ab-btn:hover:not(:disabled){border-color:var(--accent-amber);color:var(--accent-amber)}
    .ab-btn:disabled{opacity:.35;cursor:not-allowed}
    .ab-btn.primary{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0a0e1a}
    .ab-btn.primary:hover:not(:disabled){color:#0a0e1a;transform:translateY(-1px)}
    /* --- [NEW] edit sheets (reuse popup overlay pattern) --- */
    .edit-sheet .sheet-title{font-family:'M PLUS Rounded 1c',sans-serif;font-size:16px;font-weight:700;margin-bottom:2px}
    .edit-sheet .sheet-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;font-family:'IBM Plex Mono',monospace}
    .edit-sheet textarea{width:100%;min-height:76px;background:var(--bg-card);border:1px solid var(--border-dim);border-radius:10px;padding:12px;font-size:19px;color:var(--text-primary);font-family:'Noto Sans JP',sans-serif;outline:none;resize:vertical;line-height:1.7;margin-bottom:16px}
    .edit-sheet textarea:focus{border-color:var(--accent-amber)}
    .edit-sheet input[type=text]{width:100%;background:var(--bg-card);border:1px solid var(--border-dim);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--text-primary);font-family:'Noto Sans JP',sans-serif;outline:none;margin-bottom:16px}
    .edit-sheet input[type=text]:focus{border-color:var(--accent-amber)}
    .speaker-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .spk-chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border-dim);background:var(--bg-card);color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
    .spk-chip:hover{border-color:var(--border-glow);color:var(--text-primary)}
    .spk-chip.on{border-color:var(--accent-amber);color:var(--accent-amber);background:rgba(245,158,11,.1)}
    .spk-chip .dot{width:8px;height:8px;border-radius:50%}
    .merge-preview{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:10px;padding:12px 14px;margin-bottom:16px}
    .merge-preview__row{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);padding:4px 0;display:flex;gap:10px}
    .merge-preview__row.del{text-decoration:line-through;opacity:.5}
    .merge-preview__row b{color:var(--accent-amber);font-family:'Noto Sans JP',sans-serif}
    .sheet-actions{display:flex;gap:10px}
    .btn-amber{flex:1;padding:13px;border:none;border-radius:11px;font-size:14px;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;cursor:pointer;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0a0e1a;transition:all .2s}
    .btn-amber:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,158,11,.3)}
    .btn-ghost{padding:13px 18px;border:1px solid var(--border-dim);border-radius:11px;font-size:14px;background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Noto Sans JP',sans-serif}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid var(--accent-green);color:var(--accent-green);padding:10px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:300;animation:fadeUp .25s ease-out;box-shadow:0 10px 34px rgba(0,0,0,.5);white-space:nowrap}
    @media(min-width:640px){.dl-text{font-size:24px}.word-popup{border-radius:20px;margin:auto;max-height:80vh}.word-popup-overlay{align-items:center}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://ulgrfumbwjovbjzjiems.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZ3JmdW1id2pvdmJqemppZW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzIyNjcsImV4cCI6MjA4Mjk0ODI2N30.ix5Vh4Y3GXNbQbzVtTD_WSko0L3cr5q_eCnTuDEMh7M';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const ADMIN_ID='d469efb7-f9e1-4b49-8b14-75a42b4d22e0'; // [NEW] same gate as render-home.js
const segmenter=new Intl.Segmenter('ja',{granularity:'word'});
const isKanji=c=>c>='\u4E00'&&c<='\u9FFF';
const isHiragana=c=>c>='\u3040'&&c<='\u309F';
const isKatakana=c=>c>='\u30A0'&&c<='\u30FF';
const isJP=s=>[...s].some(c=>isKanji(c)||isHiragana(c)||isKatakana(c));
const isPunct=s=>/^[\s\p{P}\p{S}\uFF01\uFF1F\u3002\u3001\u300C\u300D\u300E\u300F\uFF08\uFF09\u2026\u2015\uFF5E\u30FB]+$/u.test(s);

// [NEW] Colloquial contractions Intl.Segmenter splits wrongly
// (いねえ → い+ねえ, 知らねえ → 知ら+ねえ, ってんだよ → って+ん+だ+よ).
// Longest-match first, checked BEFORE the segmenter. Grow this list as
// you notice bad splits while reading.
const COLLOQUIAL=['だってばよ','ってんだよ','じゃねえか','知らねえ','じゃねえ','いねえ','ねえよ','てめえ','すげえ','うるせえ','やべえ','でけえ','はええ'].sort((a,b)=>b.length-a.length);
const LEX_RE=new RegExp('('+COLLOQUIAL.join('|')+')','g');

// [NEW] compound words Intl.Segmenter splits (断ち切る → 断ち+切る). Checked after
// segmentation together with the vocab DB — grow this as you spot bad splits.
const WHOLE_WORDS=new Set(['断ち切る','受け止める','追いかける','引き受ける','乗り越える','繰り返す','取り戻す','立ち上がる','飛び出す','見つめる',
// Naruto jargon the segmenter splits
'影分身','分身','螺旋丸','写輪眼','万華鏡写輪眼','白眼','人柱力','尾獣','九尾','一尾','八尾','口寄せ','千鳥','仙人モード','木ノ葉隠れ','砂隠れ','霧隠れ','岩隠れ','雲隠れ','火影','風影','水影','土影','雷影','忍術','幻術','体術','血継限界','チャクラ','手裏剣','苦無','忍界大戦','里抜け','抜け忍','暗部','根']);

// [NEW] scene detection: a gap ≥ this many seconds starts a new scene
const SCENE_GAP_S=10;
const t2s=t=>{const m=String(t||'').match(/(\d+):(\d+):(\d+)[.,]?(\d*)/);return m?(+m[1]*3600)+(+m[2]*60)+(+m[3])+(+('0.'+(m[4]||'0'))):null};
const shortT=t=>String(t||'').slice(3,8);

function parseSRT(t){const b=t.trim().replace(/\r\n/g,'\n').split(/\n\n+/),L=[];for(const k of b){const p=k.split('\n');if(p.length<3)continue;const m=p[1].match(/(\d{2}:\d{2}:\d{2}[,.]?\d{0,3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,.]?\d{0,3})/);if(!m)continue;const d=p.slice(2).join(' ').replace(/<[^>]+>/g,'').replace(/\{[^}]+\}/g,'').trim();if(!d)continue;L.push({start:m[1].replace(',','.'),end:m[2].replace(',','.'),text:d})}return L}
function parseASS(t){const L=[],re=/^Dialogue:\s*\d+,(\d+:\d{2}:\d{2}\.\d{2}),(\d+:\d{2}:\d{2}\.\d{2}),[^,]*,[^,]*,\d+,\d+,\d+,[^,]*,(.*)/;for(const l of t.split('\n')){const m=l.match(re);if(!m)continue;const d=m[3].replace(/\{[^}]*\}/g,'').replace(/\\[Nn]/g,' ').trim();if(!d)continue;L.push({start:m[1],end:m[2],text:d})}return L}
const speakerRe=/^[\uFF08\u0028]([^\uFF09\u0029]+)[\uFF09\u0029]\s*(.*)/;
function splitSpeaker(text){const m=text.match(speakerRe);return m?{speaker:m[1].trim(),dialogue:m[2].trim()}:{speaker:'',dialogue:text}}

class AnimeReader{
  constructor(){
    this.user=null;this.vocabulary=[];this.vocabLookup={};this.savedAnimeWords={};
    this.currentView='browse'; // 'browse','episodes','reading','summary','import'
    this.animeList=[];this.episodeList=[];this.selectedAnime='';this.selectedEpisode=null;
    this.importMode='srt';this.srtFile=null;this.rawText='';
    this.dialogueLines=[];this.allTokens=[];this.wordPopup=null;
    this.sessions=[];this.loading=false;
    // [NEW] correction state
    this.editMode=false;this.selected=new Set();this.sheet=null;this.sceneTitles={};
    this.init();
  }

  async init(){
    const{data:{session}}=await sb.auth.getSession();
    if(session)this.user=session.user;
    sb.auth.onAuthStateChange((ev,session)=>{
      if(ev==='INITIAL_SESSION')return;
      this.user=session?.user||null;
      if(ev==='SIGNED_IN'){this.loadVocabulary();this.loadSavedAnimeWords();this.loadAnimeList()}
      this.render();
    });
    if(this.user)await Promise.all([this.loadVocabulary(),this.loadSavedAnimeWords(),this.loadAnimeList()]);
    this.render();
    // [NEW] bookmark: save position as you scroll (debounced)
    window.addEventListener('scroll',()=>{clearTimeout(this._bmTimer);this._bmTimer=setTimeout(()=>this._saveBookmark(),250)},{passive:true});
  }
  isAdmin(){return this.user?.id===ADMIN_ID} // [NEW]

  // === DATA ===
  async loadVocabulary(){
    try{let a=[],p=0;while(true){const{data,error}=await sb.from('japanese_vocabulary').select('id,kanji,hiragana,meaning_en,hint,level').range(p*1000,(p+1)*1000-1).order('id');if(error||!data?.length)break;a=a.concat(data);if(data.length<1000)break;p++}
    this.vocabulary=a;this.vocabLookup={};for(const v of a){if(v.kanji)this.vocabLookup[v.kanji]=v;if(v.hiragana&&!this.vocabLookup[v.hiragana])this.vocabLookup[v.hiragana]=v}
    console.log(`Vocab: ${a.length}`)}catch(e){console.error(e)}
  }
  async loadSavedAnimeWords(){
    if(!this.user)return;try{const{data}=await sb.from('japanese_anime_words').select('*').eq('user_id',this.user.id);this.savedAnimeWords={};for(const w of(data||[]))this.savedAnimeWords[w.base_form]=w}catch(e){console.error(e)}
  }
  async loadAnimeList(){
    try{
      const{data,error}=await sb.from('japanese_anime_subtitles').select('anime_name').limit(100);
      if(error){console.log('Subtitles table error:',error.message);this.animeList=[];return}
      if(!data||data.length===0){this.animeList=[];return}
      this.animeList=[...new Set(data.map(r=>r.anime_name))];
    }catch(e){console.error('loadAnimeList:',e);this.animeList=[]}
  }
  async loadEpisodes(animeName){
    this.loading=true;this.render();
    try{
      const{data,error}=await sb.from('japanese_anime_subtitles').select('episode').eq('anime_name',animeName).eq('line_number',1).order('episode');
      if(error){console.error(error);this.episodeList=[];}
      else{this.episodeList=(data||[]).map(r=>r.episode)}
    }catch(e){console.error(e);this.episodeList=[]}
    this.loading=false;this.render();
  }
  async loadEpisodeDialogue(animeName,episode){
    this.loading=true;this.render();
    try{const{data}=await sb.from('japanese_anime_subtitles').select('*').eq('anime_name',animeName).eq('episode',episode).order('line_number');
    if(!data?.length){alert('No dialogue found');this.loading=false;this.render();return}
    // [CHANGED] keep id + line_number so corrections can write back
    const rawLines=data.map(r=>({id:r.id,ln:r.line_number,start:r.start_time,end:r.end_time,text:r.dialogue,speaker:r.speaker||'',tokens:r.tokens||null}));

    this.processDialogue(rawLines,true);
    this.selectedAnime=animeName;this.selectedEpisode=episode;
    this.currentView='reading';
    this.editMode=false;this.selected.clear();this.sheet=null;
    await this.loadSceneTitles(animeName,episode); // [NEW]
    }catch(e){console.error(e)}
    this.loading=false;this.render();
    this._restoreBookmark(); // [NEW] jump back to where you left off
  }
  // [NEW] custom scene titles (japanese_anime_scenes); table may not exist yet — fail soft
  async loadSceneTitles(animeName,episode){
    this.sceneTitles={};
    try{const{data}=await sb.from('japanese_anime_scenes').select('start_line,title').eq('anime_name',animeName).eq('episode',episode);
    for(const r of(data||[]))this.sceneTitles[r.start_line]=r.title}catch(e){}
  }

  // === TOKENIZATION ===
  // [CHANGED] colloquial lexicon runs before the segmenter (longest match)
  _classify(s){
    if(isPunct(s))return{surface:s,type:'punct'};
    const v=this.vocabLookup[s],sv=this.savedAnimeWords[s];
    let type='unknown';if(v)type='known';else if(sv)type='saved';else if(!isJP(s))type='punct';
    return{surface:s,type,vocabEntry:v||null,savedEntry:sv||null};
  }
  tokenizeLine(text){
    const out=[];
    for(const part of String(text||'').split(LEX_RE)){
      if(!part)continue;
      if(COLLOQUIAL.includes(part)){out.push(this._classify(part));continue}
      for(const seg of segmenter.segment(part)){
        const s=seg.segment;
        if(!seg.isWordLike||isPunct(s)){out.push({surface:s,type:'punct'});continue}
        out.push(this._classify(s));
      }
    }
    return this._mergeCompounds(this._mergeRenyokei(this._mergeOkurigana(out)));
  }
  // [NEW] okurigana rule: kanji + hiragana conjugation split by the segmenter
  // (変/わって → 変わって) — merged when its dictionary base (変わる) is a known word.
  _deinflect(s){
    const M=[[/って$/,'る'],[/って$/,'う'],[/って$/,'つ'],[/った$/,'る'],[/った$/,'う'],[/った$/,'つ'],[/んで$/,'む'],[/んで$/,'ぶ'],[/んだ$/,'む'],[/んだ$/,'ぶ'],[/いて$/,'く'],[/いた$/,'く'],[/いで$/,'ぐ'],[/いだ$/,'ぐ'],[/して$/,'す'],[/した$/,'す'],[/れば$/,'る'],[/えば$/,'う'],[/けば$/,'く'],[/せば$/,'す'],[/てば$/,'つ'],[/めば$/,'む'],[/べば$/,'ぶ'],[/げば$/,'ぐ'],[/ねば$/,'ぬ'],[/ければ$/,'い'],[/かった$/,'い'],[/くて$/,'い'],[/くない$/,'い'],[/く$/,'い'],[/て$/,'る'],[/た$/,'る'],[/わない$/,'う'],[/らない$/,'る'],[/かない$/,'く'],[/さない$/,'す'],[/まない$/,'む'],[/たない$/,'つ'],[/ばない$/,'ぶ'],[/れない$/,'る'],[/えない$/,'う'],[/けない$/,'く'],[/せない$/,'す'],[/めない$/,'む'],[/べない$/,'ぶ'],[/げない$/,'ぐ'],[/ない$/,'る'],[/り$/,'る'],[/き$/,'く'],[/し$/,'す'],[/ち$/,'つ'],[/み$/,'む'],[/れる$/,'る'],[/える$/,'う'],[/ける$/,'く'],[/せる$/,'す'],[/てる$/,'つ'],[/める$/,'む'],[/べる$/,'ぶ'],[/げる$/,'ぐ'],[/ねる$/,'ぬ']];
    const c=[];for(const[re,rep]of M)if(re.test(s))c.push(s.replace(re,rep));return c;
  }
  _mergeOkurigana(toks){
    const known=s=>WHOLE_WORDS.has(s)||!!this.vocabLookup[s]||!!this.savedAnimeWords[s];
    const out=[];
    for(let i=0;i<toks.length;i++){
      const a=toks[i],b=toks[i+1];
      if(b&&a.type!=='punct'&&b.type!=='punct'&&/^[\u4e00-\u9fff]{1,2}$/.test(a.surface)&&/^[\u3041-\u3096]{2,}$/.test(b.surface)){
        const cand=a.surface+b.surface;
        let base=known(cand)?cand:null;
        if(!base)for(const d of this._deinflect(cand))if(known(d)){base=d;break}
        if(base){
          const t=this._classify(cand);
          if(t.type==='unknown'){const v=this.vocabLookup[base],sv=this.savedAnimeWords[base];
            if(v){t.type='known';t.vocabEntry=v}else if(sv){t.type='saved';t.savedEntry=sv}}
          out.push(t);i++;continue}
      }
      out.push(a);
    }
    return out;
  }
  // [NEW] grammar rule for compound verbs (複合動詞): kanji-stem + い + kanji verb
  // 追/い/詰めた → 追い詰めた, 立ち/上がる → 立ち上がる — no dictionary needed.
  _mergeRenyokei(toks){
    const K=/^[\u4e00-\u9fff]/,STEM=/^[\u4e00-\u9fff]{1,2}[\u3044\u3061\u304d\u3057\u308a\u3073\u307f]$/;
    const out=[];
    for(let i=0;i<toks.length;i++){
      const a=toks[i],b=toks[i+1],c=toks[i+2];
      const w=t=>t&&t.type!=='punct';
      if(w(a)&&w(b)&&w(c)&&/^[\u4e00-\u9fff]{1,2}$/.test(a.surface)&&b.surface==='\u3044'&&K.test(c.surface)){
        out.push(this._classify(a.surface+b.surface+c.surface));i+=2;continue}
      if(w(a)&&w(b)&&STEM.test(a.surface)&&K.test(b.surface)){
        out.push(this._classify(a.surface+b.surface));i+=1;continue}
      out.push(a);
    }
    return out;
  }
  // [NEW] merge adjacent segments whose concatenation is a real word
  // (vocab DB, saved anime words, or WHOLE_WORDS): 断ち + 切る → 断ち切る.
  _mergeCompounds(toks){
    const inDict=s=>WHOLE_WORDS.has(s)||!!this.vocabLookup[s]||!!this.savedAnimeWords[s];
    const out=[];
    for(let i=0;i<toks.length;i++){
      let hit=0;
      for(let k=Math.min(4,toks.length-i);k>=2;k--){
        const grp=toks.slice(i,i+k);
        if(grp.some(t=>t.type==='punct'))continue;
        if(inDict(grp.map(t=>t.surface).join(''))){hit=k;break}
      }
      if(hit){out.push(this._classify(toks.slice(i,i+hit).map(t=>t.surface).join('')));i+=hit-1}
      else out.push(toks[i]);
    }
    return out;
  }
  // [NEW] pre-tokenized lines from the DB (tokens column, | separated) skip the
  // browser segmenter; tokens may carry MeCab's dictionary form as surface=dictform
  // (戻れば=戻る) — exact linking for any verb/adj form; deinflect stays as fallback
  _tokensFromStored(str){
    return String(str).split('|').filter(s=>s!=='').map(pair=>{
      const eq=pair.indexOf('='),s=eq>0?pair.slice(0,eq):pair,base=eq>0?pair.slice(eq+1):null;
      if(isPunct(s)||!isJP(s))return{surface:s,type:'punct'};
      const t=this._classify(s);if(base)t.base=base;
      if(t.type==='unknown'){
        // chain: surface -> MeCab base (取れない->取れる) -> further deinflection (取れる->取る)
        const cands=base?[base,...this._deinflect(base),...this._deinflect(s)]:this._deinflect(s);
        for(const d of cands){
          const v=this.vocabLookup[d],sv=this.savedAnimeWords[d];
          if(v){t.type='known';t.vocabEntry=v;break}
          if(sv){t.type='saved';t.savedEntry=sv;break}}}
      return t;
    });
  }
  processDialogue(rawLines,hasSpeaker=false){
    let lastSpeaker='';
    this.dialogueLines=rawLines.map((line,i)=>{
      let speaker=line.speaker||'';
      let dialogue=line.text||'';
      if(!hasSpeaker){const sp=splitSpeaker(dialogue);speaker=sp.speaker;dialogue=sp.dialogue;if(speaker)lastSpeaker=speaker;else speaker=lastSpeaker}
      return{...line,index:i,speaker,dialogue,tokens:line.tokens?this._tokensFromStored(line.tokens):this.tokenizeLine(dialogue)};
    });
    this._rebuildAllTokens();
  }
  _rebuildAllTokens(){ // [NEW] factored out so corrections can refresh stats
    const seen=new Set();this.allTokens=[];
    for(const l of this.dialogueLines)for(const t of l.tokens){if(t.type==='punct')continue;if(seen.has(t.surface))continue;seen.add(t.surface);this.allTokens.push(t)}
  }
  _reindex(){this.dialogueLines.forEach((l,i)=>l.index=i)} // [NEW]

  // === [NEW] SCENES & GROUPING ===
  sceneList(){
    const out=[];let cur=null;
    this.dialogueLines.forEach((l,i)=>{
      let split=i===0;
      if(!split){
        const a=t2s(this.dialogueLines[i-1].end),b=t2s(l.start);
        split=(a!=null&&b!=null&&b-a>=SCENE_GAP_S);
      }
      if(split){cur={startLn:l.ln??l.index,lines:[]};out.push(cur)}
      cur.lines.push(l);
    });
    return out.map((sc,i)=>({...sc,n:i+1,
      title:this.sceneTitles[sc.startLn]||('Scene '+(i+1)),
      from:sc.lines[0].start,to:sc.lines[sc.lines.length-1].end}));
  }
  sceneGroups(scene){
    const gs=[];let g=null;
    for(const l of scene.lines){
      if(!g||g.speaker!==l.speaker){g={speaker:l.speaker,lines:[]};gs.push(g)}
      g.lines.push(l);
    }
    return gs;
  }
  selectedContiguous(){
    if(this.selected.size<2)return false;
    const idxs=[...this.selected].sort((a,b)=>a-b);
    return idxs.every((v,i)=>i===0||v===idxs[i-1]+1);
  }
  canEdit(){return this.isAdmin()&&!!this.selectedEpisode} // DB rows only, not file imports
  // === [NEW] BOOKMARK: remembers reading position per anime+episode (localStorage) ===
  _bmKey(){return `animeBM_${this.selectedAnime}_${this.selectedEpisode}`}
  _saveBookmark(){
    if(this.currentView!=='reading'||!this.selectedEpisode)return;
    let best=null;
    for(const el of document.querySelectorAll('[data-gl]')){if(el.getBoundingClientRect().top>=110){best=el;break}}
    if(best)try{localStorage.setItem(this._bmKey(),best.dataset.gl)}catch(e){}
  }
  _restoreBookmark(){
    const v=localStorage.getItem(this._bmKey());if(v==null)return;
    const el=document.querySelector(`[data-gl="${v}"]`);if(!el)return;
    const y=el.getBoundingClientRect().top+window.scrollY-110;
    if(y>50){window.scrollTo(0,y);this.toast('\uD83D\uDD16 Resumed where you left off')}
  }
  toast(msg){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const el=document.createElement('div');el.className='toast';el.textContent=msg;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2200);
  }

  // === [NEW] CORRECTION WRITES ===
  async saveLineEdit(idx,text,speaker){
    const l=this.dialogueLines[idx];if(!l)return;
    const patch={dialogue:text};if(speaker)patch.speaker=speaker;
    const{error}=await sb.from('japanese_anime_subtitles').update(patch).eq('id',l.id);
    if(error){alert('Update failed: '+error.message);return}
    l.dialogue=text;l.text=text;if(speaker)l.speaker=speaker;
    l.tokens=this.tokenizeLine(text);
    this._rebuildAllTokens();
    this.sheet=null;this.selected.clear();this.render();
    this.toast('✓ Line updated');
  }
  async applySpeaker(speaker){
    const idxs=[...this.selected];
    const ids=idxs.map(i=>this.dialogueLines[i].id);
    const{error}=await sb.from('japanese_anime_subtitles').update({speaker}).in('id',ids);
    if(error){alert('Update failed: '+error.message);return}
    idxs.forEach(i=>this.dialogueLines[i].speaker=speaker);
    this.sheet=null;this.selected.clear();this.render();
    this.toast(`✓ Speaker set on ${ids.length} line(s)`);
  }
  async mergeSelected(text,speaker){
    const idxs=[...this.selected].sort((a,b)=>a-b);
    const first=this.dialogueLines[idxs[0]],last=this.dialogueLines[idxs[idxs.length-1]];
    const rest=idxs.slice(1).map(i=>this.dialogueLines[i]);
    const patch={dialogue:text,end_time:last.end};if(speaker)patch.speaker=speaker;
    const{error:e1}=await sb.from('japanese_anime_subtitles').update(patch).eq('id',first.id);
    if(e1){alert('Merge failed: '+e1.message);return}
    const{error:e2}=await sb.from('japanese_anime_subtitles').delete().in('id',rest.map(r=>r.id));
    if(e2){alert('Merged text saved but delete failed: '+e2.message)}
    first.dialogue=text;first.text=text;first.end=last.end;if(speaker)first.speaker=speaker;
    first.tokens=this.tokenizeLine(text);
    const removeIdx=new Set(idxs.slice(1));
    this.dialogueLines=this.dialogueLines.filter((_,i)=>!removeIdx.has(i));
    this._reindex();this._rebuildAllTokens();
    this.sheet=null;this.selected.clear();this.render();
    this.toast(`✓ Merged · ${rest.length} row(s) deleted`);
  }
  async saveSceneTitle(startLn,title){
    if(title){
      const{error}=await sb.from('japanese_anime_scenes').upsert(
        {anime_name:this.selectedAnime,episode:this.selectedEpisode,start_line:startLn,title},
        {onConflict:'anime_name,episode,start_line'});
      if(error){alert('Save failed (did you run setup.sql?): '+error.message);return}
      this.sceneTitles[startLn]=title;
    }else{
      await sb.from('japanese_anime_scenes').delete().eq('anime_name',this.selectedAnime).eq('episode',this.selectedEpisode).eq('start_line',startLn);
      delete this.sceneTitles[startLn];
    }
    this.sheet=null;this.render();this.toast('✓ Scene title saved');
  }

  // === ACTIONS ===
  async startFromFile(){
    let rawLines;
    if(this.importMode==='srt'&&this.srtFile){const t=await this.srtFile.text();const ext=this.srtFile.name.toLowerCase();rawLines=(ext.endsWith('.ass')||ext.endsWith('.ssa'))?parseASS(t):parseSRT(t)}
    else if(this.importMode==='text'&&this.rawText.trim()){rawLines=this.rawText.trim().split('\n').filter(l=>l.trim()).map(l=>({start:'',end:'',text:l.trim()}))}
    else return;
    if(!rawLines.length){alert('No lines found');return}
    this.processDialogue(rawLines,false);
    this.selectedAnime='File Import';this.selectedEpisode=null;
    this.editMode=false;this.selected.clear();this.sheet=null;this.sceneTitles={};
    this.currentView='reading';this.render();
  }
  async saveWord(token){
    if(!this.user||!token)return;
    const base=token.base||token.surface;const hit=t=>t.surface===token.surface||(t.base&&t.base===base);
    try{const{data,error}=await sb.from('japanese_anime_words').upsert({user_id:this.user.id,surface_form:token.surface,base_form:base,reading:token.vocabEntry?.hiragana||'',pos:'',pos_detail:'',anime_source:this.selectedAnime||'Unknown',episode:this.selectedEpisode?String(this.selectedEpisode):null,created_at:new Date().toISOString()},{onConflict:'user_id,base_form'}).select();
    if(error){alert('Save failed');return}
    this.savedAnimeWords[base]=data?.[0]||{};
    for(const l of this.dialogueLines)for(const t of l.tokens)if(hit(t)&&t.type==='unknown'){t.type='saved';t.savedEntry=this.savedAnimeWords[base]}
    for(const t of this.allTokens)if(hit(t)){t.type='saved';t.savedEntry=this.savedAnimeWords[base]}
    this.render();if(this.wordPopup?.surface===token.surface)this.showWordPopup(token)}catch(e){console.error(e)}
  }
  async removeWord(token){
    if(!this.user||!token)return;
    const base=token.base||token.surface;const hit=t=>t.surface===token.surface||(t.base&&t.base===base);
    try{await sb.from('japanese_anime_words').delete().eq('user_id',this.user.id).eq('base_form',base);
    delete this.savedAnimeWords[base];delete this.savedAnimeWords[token.surface];
    for(const l of this.dialogueLines)for(const t of l.tokens)if(hit(t)&&t.type==='saved'){t.type='unknown';t.savedEntry=null}
    for(const t of this.allTokens)if(hit(t)){t.type='unknown';t.savedEntry=null}
    this.render();if(this.wordPopup?.surface===token.surface)this.showWordPopup(token)}catch(e){console.error(e)}
  }
  showWordPopup(t){if(!t||t.type==='punct')return;this.wordPopup=t;this.render()}
  closePopup(){this.wordPopup=null;this.render()}
  getStats(){const k=this.allTokens.filter(t=>t.type==='known').length,u=this.allTokens.filter(t=>t.type==='unknown').length,s=this.allTokens.filter(t=>t.type==='saved').length;return{known:k,unknown:u,saved:s,total:this.allTokens.length}}
  async signIn(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})}
  async signOut(){await sb.auth.signOut();this.user=null;this.render()}

  // === RENDER ===
  render(){
    const app=document.getElementById('app');if(!app)return;
    if(!this.user){app.innerHTML=this.renderLogin();this.bindAll();return}
    let body='';
    switch(this.currentView){
      case'episodes':body=this.renderEpisodes();break;
      case'reading':body=this.renderReading();break;
      case'summary':body=this.renderSummary();break;
      case'import':body=this.renderImport();break;
      default:body=this.renderBrowse();
    }
    const actionBar=(this.currentView==='reading'&&this.editMode&&this.selected.size&&!this.sheet)?this.renderActionBar():'';
    app.innerHTML=`${this.renderHeader()}${body}${actionBar}${this.sheet?this.renderEditSheet():''}${this.wordPopup?this.renderPopup():''}`;
    this.bindAll();
  }

  renderLogin(){
    return`<div class="login-screen"><div style="width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:0 8px 40px rgba(0,212,255,.2)">\uD83D\uDCFA</div>
    <div style="font-family:'M PLUS Rounded 1c',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px">\u30A2\u30CB\u30E1 Reading Mode</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:28px">Import subtitles, learn vocabulary from anime</div>
    <button class="btn-google" id="loginBtn"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>Sign in with Google</button></div>`;
  }

  renderHeader(){
    // [CHANGED] ✏️ edit-mode toggle for admin on DB-loaded episodes
    const editBtn=(this.currentView==='reading'&&this.canEdit())?`<button class="btn-icon ${this.editMode?'active':''}" id="editModeBtn" title="Edit subtitles">\u270F\uFE0F</button>`:'';
    const backBtn=this.currentView==='browse'?''
      :this.currentView==='episodes'?`<button class="btn-icon" id="navBackBtn" title="Back">\u2190</button>`
      :this.currentView==='reading'?`<button class="btn-icon" id="navBackBtn" title="Episodes">\u2190</button>${editBtn}<button class="btn-icon" id="summaryBtn" title="Summary">\uD83D\uDCCA</button>`
      :this.currentView==='summary'?`<button class="btn-icon" id="backToReadingBtn" title="Reading">\u2190</button>`
      :`<button class="btn-icon" id="navBackBtn" title="Back">\u2190</button>`;
    return`<header class="app-header"><div class="app-title">\uD83D\uDCFA \u30A2\u30CB\u30E1 Reader</div>
      <div class="header-actions"><a href="index.html" class="btn-icon" title="Main app">\uD83C\uDFE0</a>${backBtn}<button class="btn-icon" id="signOutBtn">\u23CF</button></div></header>`;
  }

  // === BROWSE ===
  renderBrowse(){
    return`<div class="view">
      <div style="text-align:center;padding:32px 0 24px"><div style="font-size:48px;margin-bottom:12px">\uD83D\uDCFA</div>
        <h1 style="font-family:'M PLUS Rounded 1c',sans-serif;font-size:22px;margin-bottom:4px">Anime Dialogue Reader</h1>
        <p style="font-size:13px;color:var(--text-secondary)">Browse episodes or import subtitle files</p></div>
      ${this.animeList.length?`<div class="card"><h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Available Anime</h3>
        ${this.animeList.map(a=>`<button data-anime="${this.esc(a)}" class="btn-secondary" style="width:100%;margin-bottom:8px;text-align:left;padding:14px 16px;font-size:15px">\uD83C\uDFAC ${this.esc(a)}</button>`).join('')}</div>`
      :`<div class="card" style="text-align:center;color:var(--text-muted)"><p style="margin-bottom:8px">No anime imported to database yet.</p><p style="font-size:12px">Run the Python import script first, or use file import below.</p></div>`}
      <button class="btn-primary" id="goImportBtn" style="background:linear-gradient(135deg,var(--accent-purple),#8a5fd9)">\uD83D\uDCC1 Import from File</button></div>`;
  }

  // === EPISODES ===
  renderEpisodes(){
    if(this.loading)return`<div class="view" style="text-align:center;padding:60px 0"><div style="font-size:32px;margin-bottom:12px">\u23F3</div><p style="color:var(--text-muted)">Loading episodes...</p></div>`;
    return`<div class="view">
      <div class="card"><h2 style="font-size:18px;font-weight:700;margin-bottom:4px">\uD83C\uDFAC ${this.esc(this.selectedAnime)}</h2>

      <div class="ep-grid">${this.episodeList.map(ep=>`<button data-ep="${ep}" class="ep-btn">${ep}</button>`).join('')}</div></div>`;
  }

  // === IMPORT ===
  renderImport(){
    const canStart=(this.importMode==='srt'&&this.srtFile)||(this.importMode==='text'&&this.rawText.trim());
    return`<div class="view">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px">\uD83D\uDCC1 Import Subtitle File</h2>
      <div class="import-tabs"><button class="import-tab ${this.importMode==='srt'?'active':''}" data-import-mode="srt">Subtitle File</button><button class="import-tab ${this.importMode==='text'?'active':''}" data-import-mode="text">Paste Text</button></div>
      ${this.importMode==='srt'?`<div class="drop-zone" id="dropZone"><input type="file" id="fileInput" accept=".srt,.ass,.ssa,.vtt" hidden>
        <div style="font-size:36px;margin-bottom:10px">\uD83D\uDCC1</div><div style="font-size:14px;color:var(--text-secondary)">Drop subtitle file or tap to browse</div><div style="font-size:11px;color:var(--text-muted);margin-top:6px">.srt .ass .ssa supported</div>
        ${this.srtFile?`<div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent-green);margin-top:8px">\u2713 ${this.esc(this.srtFile.name)}</div>`:''}</div>`
      :`<textarea class="text-import-area" id="textImportArea" placeholder="Paste Japanese dialogue...">${this.esc(this.rawText)}</textarea>`}
      <button class="btn-primary" id="startFileBtn" ${canStart?'':'disabled'}>\uD83C\uDFAC Start Reading</button></div>`;
  }

  // === READING === [CHANGED] scenes + same-speaker groups read as one statement
  renderReading(){
    const stats=this.getStats();
    const pct=stats.total?Math.round((stats.known+stats.saved)/stats.total*100):0;
    const speakerColors=['#a855f7','#34d399','#60a5fa','#f59e0b','#f87171','#22d3ee','#fb923c','#a3e635','#f472b6','#38bdf8'];
    const speakers=[...new Set(this.dialogueLines.map(l=>l.speaker).filter(Boolean))];
    const colorMap={};speakers.forEach((s,i)=>colorMap[s]=speakerColors[i%speakerColors.length]);

    const hint=this.editMode?`<b>Edit mode</b> — tap lines to select, tap a scene chip to rename`:`JP subtitles · tap a word to save`;
    let html=`<div class="reading-header"><div class="reading-meta">
        <div class="reading-anime-name">${this.esc(this.selectedAnime)}</div>
        <div class="reading-episode">${this.selectedEpisode?'Ep '+this.selectedEpisode:'File import'} \u00B7 ${hint}</div></div>
      <div class="reading-stats"><span style="color:var(--word-known)">${stats.known}\u2713</span><span style="color:var(--word-saved)">${stats.saved}\u2605</span><span style="color:var(--word-unknown)">${stats.unknown}?</span></div><div class="reading-progress"><div class="reading-progress__fill" style="width:${pct}%"></div></div></div>
    <div class="dialogue-container hide-sb${this.editMode?' edit-on':''}" style="padding-bottom:${this.editMode?'120px':'16px'}">`;

    let gi=0;
    for(const sc of this.sceneList()){
      const showChip=sc.from&&t2s(sc.from)!=null; // no headers for timestamp-less text imports
      if(showChip)html+=`<div class="scene-header"><button class="scene-chip" data-scene="${sc.startLn}">
        <span class="scene-chip__title">${this.esc(sc.title)}</span>
        <span class="scene-chip__time">${shortT(sc.from)} – ${shortT(sc.to)}</span></button></div>`;
      for(const g of this.sceneGroups(sc)){
        const c=colorMap[g.speaker]||'#64748b';
        const isActive=this.wordPopup&&g.lines.some(l=>l.tokens.includes(this.wordPopup));
        const tok=(l)=>l.tokens.map((t,j)=>t.type==='punct'?`<span class="word-token punct">${this.esc(t.surface)}</span>`:`<span class="word-token ${t.type}" data-line="${l.index}" data-token="${j}">${this.esc(t.surface)}</span>`).join('');
        html+=`<div class="dialogue-line${isActive?' active':''}" data-gl="${g.lines[0].index}" style="animation-delay:${Math.min(gi*20,300)}ms">
          <div class="dl-avatar" style="background:linear-gradient(135deg,${c},${c}aa);box-shadow:0 4px 14px ${c}55">${this.esc(g.speaker?[...g.speaker][0]:'\u2022')}</div>
          <div class="dl-main">
            ${g.speaker?`<div class="dl-meta"><span class="dl-name" style="color:${c}">${this.esc(g.speaker)}</span>${g.lines.length>1?`<span class="dl-linecount">${g.lines.length} lines</span>`:''}</div>`:''}
            <div class="dl-bubble">${this.editMode
              // edit mode: one selectable segment per DB row
              ?g.lines.map(l=>`<div class="dl-seg${this.selected.has(l.index)?' selected':''}" data-seg="${l.index}">
                  ${l.start?`<div class="dl-timestamp">${l.start}${l.end?' \u2192 '+l.end:''}</div>`:''}
                  <div class="dl-text">${tok(l)}</div><span class="seg-check">\u2713</span></div>`).join('')
              // read mode: one continuous statement per speaker run
              :`<div class="dl-seg">
                  ${g.lines[0].start?`<div class="dl-timestamp">${g.lines[0].start}${g.lines[g.lines.length-1].end?' \u2192 '+g.lines[g.lines.length-1].end:''}</div>`:''}
                  <div class="dl-text">${g.lines.map(tok).join(' ')}</div></div>`}</div>
          </div></div>`;
        gi++;
      }
    }
    html+=`<div class="reading-footer-hint">${this.editMode?'Corrections write directly to the database':'Tap any word to save it to Self Study'}</div><div style="height:40px"></div></div>`;
    return html;
  }

  // === [NEW] edit-mode chrome ===
  renderActionBar(){
    const n=this.selected.size;
    return`<div class="action-bar">
      <div class="action-bar__count"><b>${n}</b> line${n>1?'s':''} selected</div>
      <button class="ab-btn" id="abEdit" ${n===1?'':'disabled'}>\u270F\uFE0F Edit</button>
      <button class="ab-btn" id="abSpeaker">\uD83C\uDFAD Speaker</button>
      <button class="ab-btn primary" id="abMerge" ${this.selectedContiguous()?'':'disabled'}>\u26D9 Merge</button>
      <button class="ab-btn" id="abClear">\u2715</button></div>`;
  }
  _speakerChips(current){
    const speakerColors=['#a855f7','#34d399','#60a5fa','#f59e0b','#f87171','#22d3ee','#fb923c','#a3e635','#f472b6','#38bdf8'];
    const speakers=[...new Set(this.dialogueLines.map(l=>l.speaker).filter(Boolean))];
    return`<div class="speaker-chips">${speakers.map((s,i)=>`<button class="spk-chip${s===current?' on':''}" data-spk="${this.esc(s)}"><span class="dot" style="background:${speakerColors[i%speakerColors.length]}"></span>${this.esc(s)}</button>`).join('')}</div>`;
  }
  renderEditSheet(){
    const S=this.sheet;let body='';
    if(S.type==='edit'){
      const l=this.dialogueLines[S.idx];
      body=`<div class="sheet-title">Edit line</div>
        <div class="sheet-sub">line ${l.ln??''} \u00B7 ${l.start||''}${l.end?' \u2192 '+l.end:''}</div>
        <label class="form-label">Dialogue text</label>
        <textarea id="editText">${this.esc(S.text??l.dialogue)}</textarea>
        <label class="form-label">Speaker</label>${this._speakerChips(S.speaker??l.speaker)}
        <div class="sheet-actions"><button class="btn-ghost" data-close>Cancel</button><button class="btn-amber" id="saveEditBtn">Save correction</button></div>`;
    }else if(S.type==='speaker'){
      body=`<div class="sheet-title">Reassign speaker</div>
        <div class="sheet-sub">${this.selected.size} line(s)</div>
        ${this._speakerChips(S.speaker)}
        <label class="form-label">Or add a new speaker</label>
        <input type="text" id="newSpkInput" placeholder="e.g. \u30CA\u30EC\u30FC\u30BF\u30FC" value="${this.esc(S.newSpk||'')}">
        <div class="sheet-actions"><button class="btn-ghost" data-close>Cancel</button><button class="btn-amber" id="saveSpkBtn">Apply to ${this.selected.size} line(s)</button></div>`;
    }else if(S.type==='merge'){
      const idxs=[...this.selected].sort((a,b)=>a-b);
      const rows=idxs.map(i=>this.dialogueLines[i]);
      const first=rows[0],last=rows[rows.length-1];
      body=`<div class="sheet-title">Merge ${rows.length} lines</div>
        <div class="sheet-sub">keeps line ${first.ln??''} \u00B7 ${first.start||''} \u2192 ${last.end||''} \u00B7 other rows deleted</div>
        <div class="merge-preview">${rows.map((r,i)=>`<div class="merge-preview__row${i>0?' del':''}"><span>#${r.ln??r.index}</span><b>${this.esc(r.dialogue)}</b></div>`).join('')}</div>
        <label class="form-label">Merged text (editable)</label>
        <textarea id="mergeText">${this.esc(S.text??rows.map(r=>r.dialogue).join(''))}</textarea>
        <label class="form-label">Speaker</label>${this._speakerChips(S.speaker??first.speaker)}
        <div class="sheet-actions"><button class="btn-ghost" data-close>Cancel</button><button class="btn-amber" id="saveMergeBtn">Merge lines</button></div>`;
    }else if(S.type==='scene'){
      const sc=this.sceneList().find(x=>x.startLn===S.startLn);
      body=`<div class="sheet-title">Rename scene</div>
        <div class="sheet-sub">${shortT(sc.from)} – ${shortT(sc.to)}</div>
        <label class="form-label">Scene title (empty = reset)</label>
        <input type="text" id="sceneTitleInput" value="${this.esc(this.sceneTitles[S.startLn]||'')}" placeholder="Scene ${sc.n} — e.g. \u8A13\u7DF4\u5834\u3067\u306E\u5BFE\u7ACB">
        <div class="sheet-actions"><button class="btn-ghost" data-close>Cancel</button><button class="btn-amber" id="saveSceneBtn">Save title</button></div>`;
    }
    return`<div class="word-popup-overlay" id="editSheetOverlay"><div class="word-popup edit-sheet"><div class="popup-handle"></div>${body}</div></div>`;
  }

  // === POPUP ===
  renderPopup(){
    const t=this.wordPopup;if(!t)return'';
    const v=t.vocabEntry||this.vocabLookup[t.surface]||(t.base?this.vocabLookup[t.base]:null),sv=t.savedEntry||this.savedAnimeWords[t.surface]||(t.base?this.savedAnimeWords[t.base]:null);
    const isK=!!v,isS=!!sv;
    let ctx='';for(const l of this.dialogueLines){if(l.tokens.some(lt=>lt.surface===t.surface)){ctx=l.tokens.map(lt=>lt.surface===t.surface?`<em>${this.esc(lt.surface)}</em>`:this.esc(lt.surface)).join('');break}}
    return`<div class="word-popup-overlay" id="popupOverlay"><div class="word-popup"><div class="popup-handle"></div>
      <div class="popup-surface">${this.esc(t.surface)}</div>
      ${t.base&&t.base!==t.surface?`<div style="text-align:center;font-size:13px;color:var(--text-muted)">dictionary form: <b style="color:var(--text-secondary)">${this.esc(t.base)}</b></div>`:''}
      ${v?.hiragana?`<div class="popup-reading">${this.esc(v.hiragana)}</div>`:''}
      <div style="text-align:center;margin:12px 0">
        ${isK?`<span class="popup-tag known">\u2713 JLPT vocabulary</span>`:isS?`<span class="popup-tag saved">\u2605 Saved from ${this.esc(sv.anime_source||'anime')}</span>`:`<span class="popup-tag unknown">? New word</span>`}
      </div>
      ${v?`<div class="popup-meaning"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Meaning</div>
        <div style="font-size:15px;line-height:1.5">${this.esc(v.meaning_en||'')}</div>
        ${v.hint?`<div style="font-size:12px;color:var(--accent-amber);margin-top:6px">\uD83D\uDCA1 ${this.esc(v.hint)}</div>`:''}
        ${v.level?`<div style="font-size:11px;color:var(--text-muted);margin-top:6px">JLPT ${v.level}</div>`:''}</div>`:''}
      ${ctx?`<div class="popup-context">${ctx}</div>`:''}
      ${!isK?(isS?`<button class="btn-save-word saved" disabled>\u2605 Already Saved</button><button class="btn-remove-word" id="removeWordBtn">Remove</button>`
        :`<button class="btn-save-word" id="saveWordBtn">\u2605 Save Word</button>`):''}</div></div>`;
  }

  // === SUMMARY ===
  renderSummary(){
    const s=this.getStats(),un=this.allTokens.filter(t=>t.type==='unknown'),kn=this.allTokens.filter(t=>t.type==='known');
    const pct=s.total>0?Math.round(((s.known+s.saved)/s.total)*100):0;
    return`<div class="view hide-sb" style="overflow:auto;max-height:calc(100vh - 50px)">
      <div class="card"><h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px">Session Summary</h3>
        <div style="text-align:center;margin-bottom:16px"><div style="font-size:48px;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-green));-webkit-background-clip:text;-webkit-text-fill-color:transparent">${pct}%</div>
        <div style="font-size:12px;color:var(--text-muted)">Comprehension</div></div>
        <div class="summary-grid"><div class="summary-stat"><b style="color:var(--word-known)">${s.known}</b><small>Known</small></div><div class="summary-stat"><b style="color:var(--word-saved)">${s.saved}</b><small>Saved</small></div><div class="summary-stat"><b style="color:var(--word-unknown)">${s.unknown}</b><small>Unknown</small></div></div></div>
      ${un.length?`<div class="card"><h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px">Unknown (${un.length})</h3>
        ${un.slice(0,40).map(t=>`<div class="word-list-item"><span style="font-size:18px;font-weight:600;color:var(--word-unknown)">${this.esc(t.surface)}</span>
          <button class="btn-secondary" data-save-base="${this.esc(t.surface)}" style="padding:6px 12px;font-size:11px">\u2605 Save</button></div>`).join('')}
        ${un.length>40?`<div style="text-align:center;padding:8px;color:var(--text-muted);font-size:12px">...and ${un.length-40} more</div>`:''}</div>`:''}
      ${kn.length?`<div class="card"><h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px">Known (${kn.length})</h3>
        ${kn.slice(0,20).map(t=>`<div class="word-list-item"><div><span style="font-size:16px;font-weight:600;color:var(--word-known)">${this.esc(t.surface)}</span>
          <span style="font-size:12px;color:var(--accent-cyan);margin-left:8px">${t.vocabEntry?.hiragana||''}</span></div>
          <span style="font-size:12px;color:var(--text-secondary)">${this.esc(t.vocabEntry?.meaning_en||'')}</span></div>`).join('')}</div>`:''}</div>`;
  }

  // === EVENTS ===
  bindAll(){
    document.getElementById('loginBtn')?.addEventListener('click',()=>this.signIn());
    document.getElementById('signOutBtn')?.addEventListener('click',()=>this.signOut());
    document.getElementById('navBackBtn')?.addEventListener('click',()=>{
      if(this.currentView==='episodes'){this.currentView='browse'}
      else if(this.currentView==='reading'){this.currentView=this.selectedEpisode?'episodes':'browse';this.dialogueLines=[];this.allTokens=[];this.wordPopup=null;this.editMode=false;this.selected.clear();this.sheet=null}
      else if(this.currentView==='import'){this.currentView='browse'}
      this.render();
    });
    document.getElementById('summaryBtn')?.addEventListener('click',()=>{this.currentView='summary';this.wordPopup=null;this.editMode=false;this.selected.clear();this.sheet=null;this.render()});
    document.getElementById('backToReadingBtn')?.addEventListener('click',()=>{this.currentView='reading';this.render()});
    document.getElementById('goImportBtn')?.addEventListener('click',()=>{this.currentView='import';this.render()});
    document.querySelectorAll('[data-anime]').forEach(b=>b.addEventListener('click',()=>{this.selectedAnime=b.dataset.anime;this.currentView='episodes';this.loadEpisodes(this.selectedAnime)}));
    document.querySelectorAll('[data-ep]').forEach(b=>b.addEventListener('click',()=>this.loadEpisodeDialogue(this.selectedAnime,parseInt(b.dataset.ep))));
    document.querySelectorAll('[data-import-mode]').forEach(b=>b.addEventListener('click',()=>{this.importMode=b.dataset.importMode;this.render()}));
    const ta=document.getElementById('textImportArea');if(ta)ta.addEventListener('input',()=>this.rawText=ta.value);
    const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
    if(dz&&fi){dz.addEventListener('click',()=>fi.click());dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer?.files?.[0]){this.srtFile=e.dataTransfer.files[0];this.render()}});fi.addEventListener('change',()=>{if(fi.files?.[0]){this.srtFile=fi.files[0];this.render()}})}
    document.getElementById('startFileBtn')?.addEventListener('click',()=>this.startFromFile());
    // Word tokens (read mode only)
    if(!this.editMode)document.querySelectorAll('.word-token[data-line]').forEach(el=>el.addEventListener('click',()=>{const t=this.dialogueLines[+el.dataset.line]?.tokens[+el.dataset.token];if(t)this.showWordPopup(t)}));
    // Popup
    document.getElementById('popupOverlay')?.addEventListener('click',e=>{if(e.target.id==='popupOverlay')this.closePopup()});
    document.getElementById('saveWordBtn')?.addEventListener('click',()=>{if(this.wordPopup)this.saveWord(this.wordPopup)});
    document.getElementById('removeWordBtn')?.addEventListener('click',()=>{if(this.wordPopup)this.removeWord(this.wordPopup)});
    document.querySelectorAll('[data-save-base]').forEach(b=>b.addEventListener('click',()=>{const t=this.allTokens.find(x=>x.surface===b.dataset.saveBase);if(t)this.saveWord(t)}));

    // === [NEW] edit mode wiring ===
    document.getElementById('editModeBtn')?.addEventListener('click',()=>{
      this.editMode=!this.editMode;this.selected.clear();this.sheet=null;this.wordPopup=null;this.render();
    });
    if(this.editMode){
      document.querySelectorAll('[data-seg]').forEach(el=>el.addEventListener('click',()=>{
        const i=+el.dataset.seg;
        this.selected.has(i)?this.selected.delete(i):this.selected.add(i);
        this.render();
      }));
      document.querySelectorAll('[data-scene]').forEach(el=>el.addEventListener('click',()=>{
        this.sheet={type:'scene',startLn:+el.dataset.scene};this.render();
      }));
    }
    document.getElementById('abEdit')?.addEventListener('click',()=>{this.sheet={type:'edit',idx:[...this.selected][0]};this.render()});
    document.getElementById('abSpeaker')?.addEventListener('click',()=>{this.sheet={type:'speaker'};this.render()});
    document.getElementById('abMerge')?.addEventListener('click',()=>{this.sheet={type:'merge'};this.render()});
    document.getElementById('abClear')?.addEventListener('click',()=>{this.selected.clear();this.render()});
    document.getElementById('editSheetOverlay')?.addEventListener('click',e=>{if(e.target.id==='editSheetOverlay'){this.sheet=null;this.render()}});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{this.sheet=null;this.render()}));
    document.querySelectorAll('.spk-chip').forEach(b=>b.addEventListener('click',()=>{
      // keep typed text when re-rendering the sheet
      const t=document.getElementById(this.sheet?.type==='merge'?'mergeText':'editText');if(t)this.sheet.text=t.value;
      const ns=document.getElementById('newSpkInput');if(ns)this.sheet.newSpk=ns.value;
      this.sheet.speaker=b.dataset.spk;this.render();
    }));
    document.getElementById('saveEditBtn')?.addEventListener('click',()=>{
      const text=document.getElementById('editText').value.trim();if(!text)return;
      this.saveLineEdit(this.sheet.idx,text,this.sheet.speaker);
    });
    document.getElementById('saveSpkBtn')?.addEventListener('click',()=>{
      const spk=(document.getElementById('newSpkInput').value.trim())||this.sheet.speaker;
      if(spk)this.applySpeaker(spk);
    });
    document.getElementById('saveMergeBtn')?.addEventListener('click',()=>{
      const text=document.getElementById('mergeText').value.trim();if(!text)return;
      this.mergeSelected(text,this.sheet.speaker);
    });
    document.getElementById('saveSceneBtn')?.addEventListener('click',()=>{
      this.saveSceneTitle(this.sheet.startLn,document.getElementById('sceneTitleInput').value.trim());
    });
  }
  esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
}
window.animeReader=new AnimeReader();
</script>
</body>
</html>
