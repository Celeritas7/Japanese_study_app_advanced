<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialogue Grouping Prototype — Episode 2</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--card:#1c2030;--border:#2a2f42;--text:#e8eaf2;--text-secondary:#aab0c5;--text-muted:#6b7189;--accent:#7c9aff;--accent-dim:#31406e;--saved:#f0b429;--conj:#5ecfa3;--punct:#4a5069}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;min-height:100vh}
a{color:var(--accent)}a:hover{color:#a3b8ff}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
header h1{font-size:15px;font-weight:700;letter-spacing:.02em}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--text-muted);margin-top:2px}
.ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
.ctrl input[type=range]{width:110px;accent-color:var(--accent)}
.ctrl .val{min-width:34px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
.ctrl label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.ctrl input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
#stats{margin-left:auto;font-size:12px;color:var(--text-muted)}
#stats b{color:var(--text)}
main{max-width:860px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:14px}
.dlg{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.dlg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dlg-speaker{font-size:12px;font-weight:700;color:var(--accent)}
.dlg-time{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.dlg-lines{font-size:11px;color:var(--text-muted);margin-left:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
.dlg-text{font-size:20px;line-height:1.9}
.tok{cursor:pointer;border-radius:4px;padding:1px 1px;transition:background .12s}
.tok:hover{background:var(--accent-dim)}
.tok.conj{border-bottom:2px solid var(--conj)}
.tok.punct{color:var(--punct);cursor:default}
.tok.punct:hover{background:none}
.seam{display:inline-block;width:0;border-left:1px dashed var(--text-muted);height:1em;vertical-align:-2px;margin:0 3px;opacity:.55}
body.hide-seams .seam{display:none}
.music .dlg-text{color:var(--text-muted)}
#popup{position:fixed;display:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;min-width:170px;text-align:center}
#popup .p-surface{font-size:22px;font-weight:700}
#popup .p-base{font-size:13px;color:var(--text-muted);margin-top:4px}
#popup .p-base b{color:var(--conj);font-size:15px}
#popup .p-jisho{display:inline-block;margin-top:8px;font-size:12px}
.legend{font-size:11px;color:var(--text-muted);display:flex;gap:16px;padding:0 2px}
.legend span{display:flex;align-items:center;gap:5px}
.lg-conj{width:14px;border-bottom:2px solid var(--conj)}
.lg-seam{width:0;border-left:1px dashed var(--text-muted);height:12px}
</style>
</head>
<body>
<header>
<h1>Dialogue grouping — prototype<small>Naruto Shippuden · Episode 2 (one lesson, stored tokens)</small></h1>
<div class="ctrl">max gap <input type="range" id="gap" min="0" max="5" step="0.25" value="1.5"><span class="val" id="gapVal">1.5s</span></div>
<div class="ctrl"><label><input type="checkbox" id="sameSpeaker" checked>same speaker only</label></div>
<div class="ctrl"><label><input type="checkbox" id="punctBreak" checked>break at 。！？</label></div>
<div class="ctrl">max lines <input type="range" id="maxLines" min="1" max="8" step="1" value="4"><span class="val" id="maxLinesVal">4</span></div>
<div class="ctrl"><label><input type="checkbox" id="showSeams" checked>show line seams</label></div>
<div id="stats"></div>
</header>
<main>
<div class="legend"><span><i class="lg-conj"></i>conjugated — click for dictionary form</span><span><i class="lg-seam"></i>seam where subtitle lines were merged</span></div>
<div id="list"></div>
</main>
<div id="popup"></div>
<script src="episode2_data.js"></script>
<script>
const $=id=>document.getElementById(id);
const SENT_END=/[。！？!?]\s*$/;
const isPunct=s=>/^[\s。、！？!?…・「」『』（）()〈〉《》♪～―ー\-＜＞<>\.]+$/.test(s);
function parseTok(t){const i=t.indexOf('=');return i>0?{s:t.slice(0,i),b:t.slice(i+1)}:{s:t,b:null}}
function fmt(sec){const m=Math.floor(sec/60),s=(sec%60).toFixed(1);return m+':'+(s<10?'0':'')+s}
function group(rows,o){
  const out=[];let cur=null;
  for(const [n,sp,s,e,tok] of rows){
    const toks=tok.split('|').map(parseTok);
    const music=toks.every(t=>/^[♪～\s]*$/.test(t.s));
    const canMerge=cur&&!cur.music&&!music
      &&(s-cur.e)<=o.gap
      &&(!o.sameSpeaker||sp===cur.sp)
      &&(!o.punctBreak||!SENT_END.test(cur.text))
      &&cur.lines.length<o.maxLines;
    if(canMerge){cur.parts.push(toks);cur.text+=toks.map(t=>t.s).join('');cur.e=e;cur.lines.push(n)}
    else{if(cur)out.push(cur);cur={sp,s,e,lines:[n],parts:[toks],text:toks.map(t=>t.s).join(''),music}}
  }
  if(cur)out.push(cur);
  return out;
}
function render(){
  const o={gap:+$('gap').value,sameSpeaker:$('sameSpeaker').checked,punctBreak:$('punctBreak').checked,maxLines:+$('maxLines').value};
  $('gapVal').textContent=o.gap+'s';$('maxLinesVal').textContent=o.maxLines;
  document.body.classList.toggle('hide-seams',!$('showSeams').checked);
  const groups=group(window.EPISODE2,o);
  $('stats').innerHTML='<b>'+window.EPISODE2.length+'</b> lines → <b>'+groups.length+'</b> dialogues';
  const html=groups.map(g=>{
    const body=g.parts.map(toks=>toks.map(t=>{
      if(isPunct(t.s))return'<span class="tok punct">'+esc(t.s)+'</span>';
      return'<span class="tok'+(t.b?' conj':'')+'"'+(t.b?' data-base="'+esc(t.b)+'"':'')+' data-s="'+esc(t.s)+'">'+esc(t.s)+'</span>';
    }).join('')).join('<span class="seam"></span>');
    return'<div class="dlg'+(g.music?' music':'')+'"><div class="dlg-head"><span class="dlg-speaker">'+esc(g.sp)+'</span><span class="dlg-time">'+fmt(g.s)+' – '+fmt(g.e)+'</span><span class="dlg-lines">'+(g.lines.length===1?'line '+g.lines[0]:'lines '+g.lines[0]+'–'+g.lines[g.lines.length-1])+'</span></div><div class="dlg-text">'+body+'</div></div>';
  }).join('');
  $('list').innerHTML=html;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const popup=$('popup');
document.addEventListener('click',ev=>{
  const t=ev.target.closest('.tok:not(.punct)');
  if(!t){popup.style.display='none';return}
  const s=t.dataset.s,b=t.dataset.base;
  const look=b||s;
  popup.innerHTML='<div class="p-surface">'+esc(s)+'</div>'+(b&&b!==s?'<div class="p-base">dictionary form: <b>'+esc(b)+'</b></div>':'')+'<a class="p-jisho" href="https://jisho.org/search/'+encodeURIComponent(look)+'" target="_blank" rel="noopener">jisho ↗</a>';
  popup.style.display='block';
  const r=t.getBoundingClientRect(),pw=popup.offsetWidth;
  popup.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2))+'px';
  popup.style.top=(r.bottom+8+popup.offsetHeight>innerHeight?r.top-popup.offsetHeight-8:r.bottom+8)+'px';
});
for(const id of['gap','sameSpeaker','punctBreak','maxLines','showSeams'])$(id).addEventListener('input',render);
render();
</script>
</body>
</html>
